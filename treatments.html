<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Treatments — Tinnitus Atlas</title>
<meta name="description" content="Browse every tracked tinnitus treatment with evidence scores, tiers, loudness vs distress effects, and availability.">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="treatments">
<a class="skip-link" href="#content">Skip to content</a>
<main id="content" class="wrap">
  <section class="hero" style="padding-bottom:0">
    <h1>Treatments</h1>
    <p class="lead">Every treatment we track, sorted by evidence tier. <span id="tcount">–</span> shown.</p>
  </section>
  <div class="searchbar" role="search"><span aria-hidden="true">🔎</span>
    <input id="tsearch" type="search" placeholder="Search treatments, devices, drugs, researchers, mechanisms…" aria-label="Search treatments"></div>
  <div class="chips" id="cat-chips" role="group" aria-label="Filter by category"></div>
  <div class="chips" id="flag-chips" role="group" aria-label="Filter by property">
    <button class="chip" data-flag="avail">✅ Available now</button>
    <button class="chip" data-flag="loud">🔉 Loudness evidence</button>
    <button class="chip" data-flag="distress">🧠 Distress evidence</button>
  </div>
  <div id="tlist" class="grid grid-3" style="row-gap:22px;margin-top:6px"></div>
</main>
<script src="js/app.js"></script>
</body>
</html>
