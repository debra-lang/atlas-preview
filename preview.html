hns-2014.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."}],"scoreRationale":"Multiple Cochrane reviews found nothing: 1/5, Tier 5 — the clearest marketing-vs-evidence gap on the site.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["general"],"replication":"none","safetyLevel":"moderate","independence":"mixed","independenceNote":"Supplement-industry funding common in positive studies; rigorous independent reviews are negative."},{"id":"regenerative","name":"Hair-cell regeneration & inner-ear gene therapy","category":"regenerative","tier":3,"evidenceScore":1,"oneLiner":"Gene therapy is genuinely restoring hearing in deaf children — but nothing in the regenerative pipeline measures tinnitus yet.","whatItIs":"The long-horizon hope: regrow or repair the damaged inner-ear cells whose loss drives most tinnitus. Includes hair-cell regeneration drugs (FX-322 — failed), gene therapy (DB-OTO, AK-OTOF — succeeding, for congenital deafness), and neural-progenitor cell therapy (Rinri — first-in-human).","howItWorks":"If hearing loss deprives the brain of input and the brain compensates with the phantom of tinnitus, restoring genuine input might switch the phantom off. Clinically unproven either way — no regenerative program has tinnitus as an endpoint.","mechanism":"Restoring cochlear input (hair cells, synapses, nerve, or gene function)","loudness":{"level":"none","summary":"No clinical tinnitus data from any regenerative program."},"distress":{"level":"none","summary":"Same."},"regulatory":{"status":"Investigational (all programs)","detail":"DB-OTO (Regeneron): 11 of 12 deaf children gained hearing, 3 to normal thresholds — NEJM 2025; congenital OTOF deafness, not tinnitus. FX-322/FX-345 discontinued Feb 2023 after Phase 2b failure. Rinri's Rincell-1 first-in-human approved by UK MHRA 2025.","sourceUrl":"https://investor.regeneron.com/news-releases/news-release-details/latest-db-oto-results-demonstrate-clinically-meaningful-hearing"},"availability":{"usa":"Trials only (specific genetic deafness)","europe":"Trials only","other":"Trials only","prescription":true,"cost":"N/A","availableNow":false},"developer":"Regeneron (DB-OTO), Eli Lilly/Akouos (AK-OTOF), Rinri Therapeutics","researchers":[],"subtypes":["hearing-loss-associated tinnitus (theoretical future target)"],"safety":"DB-OTO: no therapy-related serious adverse events reported to date.","bestSuitedFor":"The long watch — this is where a real cure could eventually come from","bestResult":"Hearing restoration in OTOF children (platform proof, not a tinnitus result)","limitations":["No tinnitus endpoints anywhere in the pipeline","FX-322's failure shows regeneration in adults is far harder than gene replacement in children","Whether restoring input reverses established central tinnitus is an open question"],"conflicts":"","studies":["fx322-2023","cilcare-cil001"],"extraSources":[{"title":"Regeneron — DB-OTO CHORD results (NEJM 2025)","url":"https://investor.regeneron.com/news-releases/news-release-details/latest-db-oto-results-demonstrate-clinically-meaningful-hearing"},{"title":"Frequency Therapeutics FX-322 Phase 2b failure (Feb 2023)","url":"https://www.businesswire.com/news/home/20230213005212/en/Frequency-Therapeutics-Announces-Topline-Results-for-its-Phase-2b-Study-of-FX-322-for-the-Treatment-of-Sensorineural-Hearing-Loss"},{"title":"Rinri Therapeutics — first-in-human cell therapy approved (Sheffield, 2025)","url":"https://sheffield.ac.uk/news/first-human-trial-regenerative-cell-therapy-sensorineural-hearing-loss-approved"}],"timeline":[{"year":2023,"event":"FX-322 Phase 2b fails; Frequency Therapeutics exits hearing (Feb)."},{"year":2024,"event":"AK-OTOF restores hearing in first participant (Lilly/Akouos)."},{"year":2025,"event":"DB-OTO CHORD results published in NEJM; Rinri first-in-human approved."}],"latest":[{"date":"2025-05-01","text":"DB-OTO: 11/12 children improved, 3 reached normal hearing thresholds (NEJM 2025).","url":"https://investor.regeneron.com/news-releases/news-release-details/latest-db-oto-results-demonstrate-clinically-meaningful-hearing"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 3, evidence score 1/5","reason":"Platform succeeding in adjacent indications; zero tinnitus data."},{"date":"2026-09-04","change":"independence: 'primarily-sponsor' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Study records added: fx322-2023, cilcare-cil001.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."}],"scoreRationale":"Scored for tinnitus specifically: 1/5 (no data), Tier 3 as a legitimate emerging field to watch.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["hearing-loss"],"replication":"none","safetyLevel":null,"independence":"primarily-sponsor"},{"id":"venous-stenting","name":"Venous sinus stenting (pulsatile tinnitus)","category":"vascular","tier":2,"evidenceScore":3,"oneLiner":"Pulsatile tinnitus is a different disease — and when a venous narrowing is the cause, stenting resolves it in most patients.","whatItIs":"For PULSATILE tinnitus (a rhythmic whooshing in time with the heartbeat, ~4% of tinnitus), imaging can reveal a physical cause — most treatably, transverse/sigmoid sinus stenosis. A stent placed in the narrowed vein eliminates the turbulent flow generating the sound.","howItWorks":"Narrowed dural venous sinuses create turbulent, audible blood flow near the inner ear. Stenting restores smooth flow, removing the sound at its physical source — this is cause-removal, not symptom management.","mechanism":"Eliminating turbulent venous flow at its source","loudness":{"level":"strong","summary":"In correctly selected venous-stenosis patients, pooled analysis of 28 studies (N=616): 91.7% improvement and 88.6% complete resolution of the pulsatile sound. This is elimination of the percept — in a specific, imaging-confirmed subgroup."},"distress":{"level":"moderate","summary":"Distress resolves with the sound; measured mostly as symptom resolution rather than THI/TFI."},"regulatory":{"status":"Off-label use of approved stents; dedicated device investigational","detail":"Venous stents are used off-label for pulsatile tinnitus; a dedicated device (BosSTENT, Sonorous NV) is in a 90-patient trial (NCT07070089).","sourceUrl":"https://www.sciencedirect.com/science/article/abs/pii/S1878875024014074"},"availability":{"usa":"Neurointerventional centers, after full imaging workup","europe":"Same","other":"Major centers","prescription":true,"cost":"Procedure-level costs; often covered when medically indicated","availableNow":true},"developer":"Multiple; dedicated device: Sonorous NV","researchers":[],"subtypes":["pulsatile tinnitus with imaging-confirmed venous sinus stenosis ONLY"],"safety":"Real procedural risks (vessel injury, in-stent stenosis, antiplatelet therapy); requires an experienced neurointerventional team.","bestSuitedFor":"Pulsatile tinnitus with confirmed venous sinus stenosis — see a physician for imaging; never assume","bestResult":"88.6% complete resolution (pooled, N=616)","limitations":["Observational evidence only — no RCT yet","Applies to one imaging-confirmed cause, not pulsatile tinnitus generally","Any new pulsatile tinnitus needs medical evaluation first — some causes are dangerous","A surgical alternative exists for sinus-wall anomalies: sigmoid sinus wall reconstruction (see its own page)"],"conflicts":"","studies":["stenting-pooled-2024"],"timeline":[{"year":2024,"event":"Pooled analysis of 28 studies (N=616): ~90% resolution in venous-stenosis pulsatile tinnitus."},{"year":2026,"event":"Dedicated stent (BosSTENT) 90-patient trial registered."}],"latest":[{"date":"2026-09-03","text":"Trial status change: NCT07070089 is now 'Recruiting'","url":"https://clinicaltrials.gov/study/NCT07070089"},{"date":"2026-07-01","text":"BosSTENT dedicated-device trial (N=90) registered (NCT07070089).","url":"https://clinicaltrials.gov/study/NCT07070089"}],"history":[{"date":"2026-09-03","change":"Added in Phase 2 audit: Tier 2, evidence score 3/5","reason":"Closes the platform's subjective-only blind spot; strong observational resolution rates in a defined subgroup."},{"date":"2026-09-04","change":"replication: 'strong' → 'strong-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Cross-reference added to sigmoid sinus wall reconstruction (new entry).","reason":"Audit: the surgical alternative was previously undocumented."}],"scoreRationale":"Consistent ~90% resolution across 28 observational studies earns 3/5; no RCT and strict subgroup applicability cap it there.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["pulsatile"],"narrowPopulation":true,"narrowNote":"Studied ONLY in pulsatile tinnitus with an imaging-confirmed venous sinus narrowing. Pulsatile tinnitus means a rhythmic whooshing in time with your heartbeat — if your tinnitus is a steady tone or hiss, this page is not about your tinnitus, and the ~90% resolution rates do not apply.","replication":"strong-independent","safetyLevel":"limited","replicationNote":"Consistent improvement reported across many independent surgical centers (pooled 28 studies) — but uncontrolled designs.","independence":"primarily-independent"},{"id":"sswr","name":"Sigmoid sinus wall reconstruction (pulsatile tinnitus)","category":"vascular","tier":3,"evidenceScore":2,"scoreRationale":"Uncontrolled surgical case series only (no RCT, no comparative trial vs stenting): pooled complete resolution 77.6% in a systematic review, 97.3% short-term / 83.8% at 5+ years in the longest cohort — but with 9.3% significant complications, 13.5% recurrence, and new intracranial-hypertension diagnoses in 8.6%. Resolution rates drop (to ~65% in one cohort) under stricter outcome definitions. High apparent effect in a narrow, imaging-confirmed subgroup; low certainty by design.","oneLiner":"Surgical repair of a defect in the bony wall of the sigmoid sinus — an alternative to stenting for one specific, imaging-confirmed cause of pulsatile tinnitus.","whatItIs":"For PULSATILE tinnitus caused by a sigmoid sinus wall anomaly (dehiscence or diverticulum seen on imaging), a surgeon rebuilds the bony wall between the venous sinus and the ear, blocking transmission of the blood-flow sound. It treats the same family of vascular causes as venous sinus stenting, from the outside rather than inside the vein.","howItWorks":"A defect in the bone over the sigmoid sinus lets normal (or turbulent) venous flow be heard. Reconstructing the wall restores the acoustic barrier — cause-directed treatment for one specific anatomy, not tinnitus generally.","mechanism":"Restoring the bony acoustic barrier over the sigmoid sinus","loudness":{"level":"moderate","summary":"Uncontrolled series report elimination of the pulsatile sound in most correctly selected patients (pooled 77.6% complete resolution; 83.8% durable at 5+ years in the longest cohort; ~65% under stricter definitions). Rated moderate, not strong: no controlled data, and outcome definitions vary widely."},"distress":{"level":"limited","summary":"Distress typically resolves with the sound, but series rarely measure THI/TFI systematically."},"regulatory":{"status":"Surgical procedure (no device approval applicable)","detail":"Standard otologic/neurosurgical techniques; no dedicated device.","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/38515373/"},"availability":{"usa":"Tertiary otology/neurotology centers after full imaging workup","europe":"Same","other":"Major centers","prescription":true,"cost":"Surgical-procedure costs; often covered when medically indicated","availableNow":true},"developer":"—","researchers":[],"subtypes":["pulsatile tinnitus with imaging-confirmed sigmoid sinus wall anomaly ONLY"],"subtypeTags":["pulsatile"],"narrowPopulation":true,"narrowNote":"Applies ONLY to pulsatile tinnitus with an imaging-confirmed sigmoid sinus wall anomaly (dehiscence/diverticulum) — a small fraction of the ~4% of tinnitus that is pulsatile. It is irrelevant to ordinary (non-pulsatile) tinnitus. Any NEW pulsatile tinnitus needs medical evaluation first: some causes are dangerous.","safety":"Real surgical risks: significant complications in 9.3% of pooled cases; intracranial hypertension/papilledema can emerge after reconstruction (new IIH diagnosed in 8.6% of the long-term cohort; some patients later needed venous stenting); recurrence 13.5%.","safetyLevel":"limited","replication":"limited-independent","replicationNote":"Consistent high resolution rates across several independent surgical centers — but every series is uncontrolled, so what replicates is the case-series pattern, not a controlled effect.","independence":"primarily-independent","bestSuitedFor":"Pulsatile tinnitus with a confirmed sigmoid sinus wall anomaly — see a physician for imaging; never assume","bestResult":"77.6% pooled complete resolution (SR); 83.8% durable success at 5+ years (longest cohort)","limitations":["Case series only — no randomized or controlled data","Outcome definitions vary; stricter criteria give lower success rates (~65%)","Post-operative intracranial hypertension is a real, under-appreciated risk","Applies to one imaging-confirmed anatomy, not pulsatile tinnitus generally"],"conflicts":"","studies":["sswr-evidence-2024"],"timeline":[{"year":2024,"event":"Systematic review pools surgical outcomes: 77.6% complete resolution, 9.3% significant complications."},{"year":2024,"event":"Longest follow-up cohort: 83.8% success at 5+ years; new intracranial hypertension in 8.6%."}],"latest":[],"history":[{"date":"2026-09-04","change":"Treatment added (tier 3, evidence 2/5).","reason":"Audit finding: the surgical alternative to venous stenting was absent from the database. Added with verified pooled outcomes (see audit-improvement/acquisition-report.md) and a prominent narrow-population warning."}],"lastReviewed":"2026-09-04","evidenceThrough":"2026-09-04","confidence":"moderate","studyCount":1},{"id":"tavns","name":"Transcutaneous auricular VNS (taVNS)","category":"neuromodulation","tier":3,"evidenceScore":2,"oneLiner":"Non-surgical vagus nerve stimulation via an ear clip — small pilots so far, with the largest trial ever now running.","whatItIs":"Electrical stimulation of the vagus nerve's auricular branch through a clip on the tragus/concha, alone or paired with sound (e.g., notched music) — the non-invasive cousin of the implanted paired-VNS approach. Cheap consumer ear-clip stimulators are already sold online.","howItWorks":"Vagal stimulation releases plasticity-promoting neuromodulators; pairing it with sound aims to steer auditory-circuit plasticity — same theory as implanted paired VNS, without surgery.","mechanism":"Non-invasive vagal stimulation ± sound pairing","loudness":{"level":"none","summary":"No convincing percept-level data."},"distress":{"level":"limited","summary":"Systematic reviews (2023) find only small heterogeneous pilots — insufficient evidence."},"regulatory":{"status":"Investigational for tinnitus; consumer devices unregulated","detail":"No FDA clearance/authorization for tinnitus. Sun Yat-Sen Memorial Hospital runs a multicenter double-blind RCT of taVNS + notched music (NCT05417711), with a larger successor registered — the biggest taVNS tinnitus program to date.","sourceUrl":"https://clinicaltrials.gov/study/NCT05417711"},"availability":{"usa":"Consumer tVNS gadgets sold online (unvalidated)","europe":"Same","other":"Same","prescription":false,"cost":"$100–500 consumer devices","availableNow":true},"developer":"Multiple academic groups; consumer vendors","researchers":[],"subtypes":["chronic subjective tinnitus"],"safety":"Generally well tolerated; local skin irritation; consumer devices vary in quality.","bestSuitedFor":"Research participation — consumer devices are unproven","bestResult":"Pilot-level signals only","limitations":["Only small heterogeneous pilots published","Consumer devices sold well ahead of the evidence"],"conflicts":"","studies":["tavns-sr-2023"],"timeline":[{"year":2023,"event":"Systematic review: evidence insufficient; Sun Yat-Sen double-blind RCT begins."}],"latest":[{"date":"2026-09-03","text":"Trial status change: NCT05417711 is now 'Unknown status'","url":"https://clinicaltrials.gov/study/NCT05417711"},{"date":"2026-06-01","text":"Large multicenter taVNS + notched-music program continues; successor trial registered.","url":"https://clinicaltrials.gov/study/NCT05417711"}],"history":[{"date":"2026-09-03","change":"Added in Phase 2 audit: Tier 3, evidence score 2/5","reason":"Completes the VNS/bimodal family; users conflate it with Lenire and implanted VNS."},{"date":"2026-09-04","change":"replication: 'none' → 'limited-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"Plausible mechanism, pilots only: 2/5 pending the running double-blind RCT.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["general"],"replication":"limited-independent","safetyLevel":"strong","replicationNote":"Small pilots from different groups; pooled effect of low clinical relevance.","independence":"primarily-independent"},{"id":"levo","name":"Levo System (sleep-time sound matching)","category":"sound-therapy","tier":3,"evidenceScore":2,"oneLiner":"FDA-cleared sound therapy played during sleep, matched to your tinnitus 'sound print' — one small positive trial.","whatItIs":"An iPad-based system (Otoharmonics) that builds a match of your tinnitus sound and plays it through custom earbuds while you sleep; fitted through audiology clinics and distributed in the VA.","howItWorks":"Presenting a stimulus matched to the tinnitus during sleep aims to promote habituation/adaptation to the specific percept.","mechanism":"Tinnitus-matched sound exposure during sleep","loudness":{"level":"limited","summary":"In the N=60 VA trial, the sound-match arm had the greatest reduction in rated tinnitus intensity — small study, no long-term data."},"distress":{"level":"limited","summary":"TFI improved most in the sound-match arm (Theodoroff 2017)."},"regulatory":{"status":"FDA 510(k) cleared","detail":"Cleared as a tinnitus-masking/sound-therapy device (2014) — clearance means substantial equivalence to earlier maskers, not proven efficacy.","sourceUrl":"https://pubs.asha.org/doi/10.1044/2017_AJA-17-0022"},"availability":{"usa":"Audiology clinics; VA distribution","europe":"Limited","other":"—","prescription":true,"cost":"≈$4,000–5,000 (self-pay outside VA)","available ation","tier":3,"evidenceScore":1,"oneLiner":"Focused ultrasound can reach deep brain circuits no coil can — first tinnitus study starting at Oxford; no human data yet.","whatItIs":"Low-intensity focused ultrasound aimed at deep tinnitus-related brain targets, non-invasively. Tinnitus Quest funded a $230k Oxford project (Robin Cleveland's lab) beginning around summer 2026.","howItWorks":"Ultrasound can modulate neural activity in deep structures (e.g., striatal targets implicated by DBS case series) without surgery — precision rTMS cannot reach.","mechanism":"Deep-brain neuromodulation via focused ultrasound","loudness":{"level":"none","summary":"No human tinnitus data yet."},"distress":{"level":"none","summary":"No human tinnitus data yet."},"regulatory":{"status":"Pre-clinical / first-in-human pending","detail":"Research-stage only.","sourceUrl":"https://www.prnewswire.com/news-releases/tinnitus-quest-builds-momentum-with-oxford-research-study-new-funding-call-and-second-tinnitus-hackathon-302803520.html"},"availability":{"usa":"Not available","europe":"Research only (Oxford)","other":"—","prescription":true,"cost":"N/A","availableNow":false},"developer":"University of Oxford / Tinnitus Quest funding","researchers":["Robin Cleveland"],"subtypes":["to be defined"],"safety":"Unknown for this application; low-intensity protocols generally well tolerated in other indications.","bestSuitedFor":"Watch-list item only","bestResult":"None yet","limitations":["No human tinnitus data of any kind","Rationale extrapolated from tiny DBS case series"],"conflicts":"","studies":[],"extraSources":[{"title":"Tinnitus Quest — Oxford TUS study announcement","url":"https://www.prnewswire.com/news-releases/tinnitus-quest-builds-momentum-with-oxford-research-study-new-funding-call-and-second-tinnitus-hackathon-302803520.html"}],"timeline":[{"year":2026,"event":"Tinnitus Quest funds Oxford TUS project; study starting after ethics approval."}],"latest":[{"date":"2026-06-15","text":"Oxford cts on perceived loudness."},"coi":"Cochrane-standard declarations; independent of any manufacturer.","limitations":"Mostly low-certainty evidence; almost no 6–12-month follow-up data.","history":[{"date":"2026-09-04","change":"Citation-hygiene fix: authors: 'Fuller T, Cabrera A, et al.' → 'Fuller T, Cima R, Langguth B, Mazurek B, Vlaeyen JWS, Hoare DJ'","reason":"Author list corrected — 'Cabrera A' does not appear on this Cochrane review (phantom author removed). (Research-quality audit citation pass.)"}]},{"id":"uniti-2025","title":"UNITI-RCT: single versus combined treatments for chronic tinnitus","authors":"Schoisswohl S, Basso L, Simoes J, et al. (incl. Langguth B)","journal":"Nature Communications","year":2025,"doi":"10.1038/s41467-025-66165-1","url":"https://www.nature.com/articles/s41467-025-66165-1","n":"461 (230 single / 231 combination)","design":"Multicenter RCT, 5 sites in 4 countries","randomized":true,"sham":false,"independent":true,"control":"Head-to-head: CBT, hearing aids, structured counseling, sound therapy — alone vs in combination","blinding":"Open (treatment comparison)","duration":"12 weeks","followUp":"9 months","primaryOutcome":"Between-group difference in THI change, baseline to week 12","results":{"summary":"Within-group THI change: −11.7 (single treatments) vs −14.9 (combinations); the between-group difference of ≈3.2 points was statistically significant (p=0.034) but below a ~7-point clinical-meaningfulness benchmark (external literature value — the paper itself does not define this threshold). Paper verbatim: CBT and hearing aids alone had large effect sizes 'which could not be further increased by combination treatment.'","detail":"The largest trial ever to compare tinnitus treatments head-to-head. Statistically significant, clinically marginal difference between strategies — the substantive finding is which single treatments performed best."},"coi":"EU-funded (UNITI consortium).","limitations":"Open-label; no untreated arm.","history":[{"date":"2026-09-04","change":"Labeled the 7-point MCID as an external benchmark not defined by the paper.","reason":"Research-quality audit borderline endpoint-wording pass; verified against the publication."},{"date":"2026-09-04","change":"PMID filled; author styling corrected (2nd/3rd authors are Basso L and Simoes J; Langguth is a co-author, not 2nd).","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}],"pmid":"41271763"},{"id":"beukes-2022-icbt","title":"Internet-based audiologist-guided CBT for tinnitus: US randomized controlled trial","authors":"Beukes EW, et al.","journal":"Journal of Medical Internet Research","year":2022,"doi":"10.2196/27584","url":"https://www.jmir.org/2022/2/e27584","n":"158 (79 iCBT / 79 monitoring)","design":"RCT","randomized":true,"sham":false,"independent":true,"control":"Weekly monitoring","blinding":"Unblinded","duration":"8 weeks","followUp":"1 year (separate paper)","primaryOutcome":"TFI","results":{"summary":"Post-treatment TFI 36.6 vs 46.3 (Cohen d = 0.46). Clinically significant improvement in 57% vs 15% — by the paper's own reliable-change criterion, not the standard 13-point TFI threshold.","detail":"Control was weekly monitoring (no active comparator). 1-year follow-up paper reported maintained efficacy (PMID 36353148)."},"coi":"Academic.","limitations":"Self-selected online sample; unblinded.","pmid":"35156936","history":[{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 35156936","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"id":"tent-a1-2020","title":"TENT-A1: bimodal sound + tongue stimulation for tinnitus","authors":"Conlon B, Lim HH, et al.","journal":"Science Translational Medicine","year":2020,"doi":"10.1126/scitranslmed.abb2830","url":"https://www.science.org/doi/10.1126/scitranslmed.abb2830","n":"326","design":"Randomized double-blinded comparison of three stimulation parameter sets","randomized":true,"sham":false,"independent":false,"control":"None — all three arms were active bimodal treatment","blinding":"Double-blinded between arms","duration":"12 weeks","followUp":"12 months","primaryOutcome":"Within-arm THI and TFI change at end of treatment","results":{"summary":"Pre-specified primary result: within-arm THI improvement, effect sizes d = −0.87 to −0.92 across the three arms (≈14 THI points pooled), p<0.001 — but the arms did not differ from each other, and no arm was a sham.","detail":"The widely quoted '86.2% improved at 12 weeks / 80.1% sustained at 12 months' figures come from manufacturer materials, count ANY improvement among compliant completers (not clinically meaningful responders), and could not be verified in the paper itself. Because every arm received active treatment, the trial cannot separate device effect from placebo/natural course."},"coi":"Funded by Neuromod Devices (manufacturer).","limitations":"No sham or no-treatment arm; identical results across arms; headline percentages are company-derived.","pmid":"33028707","history":[{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 33028707","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"id":"tent-a3-2024","title":"TENT-A3 pivotal trial: sound-only vs bimodal stimulation (within-subject)","authors":"Boedts M, et al.","journal":"Nature Communications","year":2024,"doi":"10.1038/s41467-024-50473-z","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11333749/","n":"112 enrolled (105 analyzed)","design":"Multi-site single-arm within-subject: 6 weeks sound-only, then 6 weeks bimodal","randomized":false,"sham":false,"independent":false,"control":"Sound-only stage as within-subject comparator","blinding":"None (sequential stages)","duration":"12 weeks total","followUp":"None reported","primaryOutcome":"Responder rate (≥7-point THI improvement) during the bimodal stage vs the point estimate from the sound-only stage","results":{"summary":"The primary endpoint was NOT achieved in the full cohort: responder rate during the bimodal stage was 43.3% vs 63.3% during the preceding sound-only stage. Important: this is a sequential design — everyone got sound first, bimodal second, and the bimodal stage was measured from an already-improved baseline — so it is NOT evidence that sound beats bimodal, but neither does it show bimodal superiority. In the moderate-or-worse subgroup (THI≥38 at stage start — a threshold specified at a pre-planned interim analysis, not in the original protocol): bimodal 58.6% vs sound-only 43.2%, p=0.022.","detail":"96.8% of device-related adverse events were mild; no serious device-related AEs. This is the trial behind the FDA De Novo authorization — which rested on the severe-subgroup result. ITT analysis n=112 with imputation for dropouts."},"coi":"Funded by Neuromod; co-author H.H. Lim has a financial interest in the manufacturer.","limitations":"Single-arm sequential design (no parallel control); full-cohort primary endpoint missed; benefit confined to the more severe subgroup.","history":[{"date":"2026-09-04","change":"Subgroup labeling made precise: the THI≥38 threshold was interim-defined, not in the original protocol.","reason":"Research-quality audit borderline endpoint-wording pass; verified against the publication."},{"date":"2026-09-04","change":"Added ITT n=112 (imputed) note.","reason":"Research-quality audit borderline endpoint-wording pass; verified against the publication."},{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 39160146","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}],"pmid":"39160146"},{"id":"kasper-2026-lenire","title":"Real-world Lenire outcomes: US clinic chart review","authors":"Kasper CA, May JM, Crossland NE, Lim HH","journal":"American Journal of Audiology","year":2026,"doi":"10.1044/2025_AJA-25-00090","pmid":"41528257","url":"https://pubs.asha.org/doi/10.1044/2025_AJA-25-00090","n":"140 fitted (66 of 104 'bothered' patients analyzed at 12 weeks)","design":"Retrospective single-site chart review","randomized":false,"sham":false,"independent":false,"control":"None","blinding":"None","duration":"12 weeks","followUp":"None","primaryOutcome":"THI change","results":{"summary":"Among the 66 bothered-tinnitus patients (THI≥38) with 12-week data, 81.8% (95% CI 70.9–89.3) achieved ≥7-point THI improvement; mean −23.8 points. Non-bothered patients showed essentially no change.","detail":"Uncontrolled real-world data with substantial follow-up attrition (66/104) and counseling co-intervention; consistent with trials but cannot separate treatment from placebo/natural course."},"coi":"Senior author Hubert Lim is Neuromod's CSO; Neuromod funded chart-review support.","limitations":"Retrospective, uncontrolled, manufacturer-linked, 37% attrition in the analyzed group.","history":[{"date":"2026-09-04","change":"Citation-hygiene fix: authors: 'Kasper D, May T, Crossland G, Lim HH.' → 'Kasper CA, May JM, Crossland NE, Lim HH'","reason":"Author initials corrected (CA/JM/NE per the publication). (Research-quality audit citation pass.)"}]},{"id":"shore-2023-jama","title":"Reversing synchronized brain circuits using targeted auditory-somatosensory stimulation (bisensory device RCT)","authors":"Jones GR, …, Shore SE.","journal":"JAMA Network Open","year":2023,"doi":"10.1001/jamanetworkopen.2023.15914","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10238951/","n":"99 randomized","design":"Double-blind randomized crossover (6-week active vs 6-week auditory-only control)","randomized":true,"sham":true,"independent":true,"control":"Auditory-only stimulation (active control)","blinding":"Double-blind","duration":"6 weeks per block, 30 min/day at home","followUp":"6-week washouts between blocks","primaryOutcome":"CO-PRIMARY: TFI change AND tinnitus loudness level (psychoacoustic loudness matching, dB SL). THI was secondary.","results":{"summary":"TFI after active treatment: −12.0 points (ITT, p<.001), −13.2 per-protocol (n=56) — within-participant changes at week 6; the control block did not produce clinically significant decreases. Loudness matching (co-primary) MISSED significance in the ITT analysis at week 6: −5.8 dB SL (p=.08) / −7.2 dB PP (p=.03) at week 6, deepening to −10.9 ITT (p=.001) / −14.1 PP (p<.001) by week 12 of the second active phase.","detail":"≥13-point TFI responders: 65% per-protocol / 53% ITT after active treatment vs 25%/20% after control. All change figures are within-participant during the bisensory blocks, not active-minus-control differences. Somatic tinnitus only. NIH-funded (RF1-MH114244)."},"coi":"NIH-funded; Shore and Martel are Auricle Inc cofounders with equity/patent interests (disclosed).","limitations":"Single-center; per-protocol n=56; somatic tinnitus subtype only; COVID disruptions.","history":[{"date":"2026-09-04","change":"Made explicit that the loudness co-primary missed significance in ITT at week 6.","reason":"Research-quality audit borderline endpoint-wording pass; verified against the publication."},{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 37266943","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}],"pmid":"37266943"},{"id":"marks-2018-stm","title":"Auditory-somatosensory bimodal stimulation desynchronizes brain circuitry (first human pilot)","authors":"Marks KL, …, Shore SE.","journal":"Science Translational Medicine","year":2018,"doi":"10.1126/scitranslmed.aal3175","url":"https://www.science.org/doi/10.1126/scitranslmed.aal3175","n":"20","design":"Randomized crossover pilot","randomized":true,"sham":true,"independent":true,"control":"Auditory-only","blinding":"Double-blind","duration":"4 weeks","followUp":"Yes (washout)","primaryOutcome":"Loudness and TFI","results":{"summary":"Reduced tinnitus loudness and TFI vs auditory-only; established the timing-dependent plasticity approach in humans.","detail":""},"coi":"NIH-funded; investigator patent interests disclosed.","limitations":"Pilot size.","pmid":"29298868","history":[{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 29298868","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"id":"trtt-2019","title":"TRTT: Tinnitus Retraining Therapy vs standard of care","authors":"Scherer RW, Formby C, et al.","journal":"JAMA Otolaryngology–Head & Neck Surgery","year":2019,"doi":"10.1001/jamaoto.2019.0821","pmid":"31120533","url":"https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2734346","n":"151","design":"Multicenter placebo-controlled RCT (6 US military hospitals)","randomized":true,"sham":true,"independent":true,"control":"TRT vs partial TRT (placebo sound generators) vs standard of care","blinding":"Participants blinded to generator status","duration":"Ongoing therapy","followUp":"18 months","primaryOutcome":"Tinnitus Questionnaire change at 18 months","results":{"summary":"TRT was not superior to standard of care — all three arms improved substantially (within-group TQ effect sizes −1.32, −1.16, −1.01) with few between-group differences. 77.5% (86/111 with data) achieved ≥7-point TQ reduction at 18 months.","detail":"Follow-up analyses attribute most benefit to the counseling component, not the sound generators."},"coi":"NIH-funded.","limitations":"Military population with adequate hearing."},{"id":"ungar-2023-act","title":"Acceptance and Commitment Therapy for tinnitus: meta-analysis","authors":"Ungar OJ, et al.","journal":"Indian Journal of Otolaryngology and Head & Neck Surgery","year":2023,"pmid":"37974721","url":"https://pubmed.ncbi.nlm.nih.gov/37974721/","n":"100 (3 RCTs)","design":"Meta-analysis","randomized":true,"sham":false,"independent":true,"control":"Untreated controls","blinding":"Varies","primaryOutcome":"THI","results":{"summary":"Pooled THI reduction −17.67 points (95% CI −23.50 to −11.84) vs untreated control.","detail":""},"coi":"Academic.","limitations":"Only ~100 pooled participants."},{"id":"mckenna-2017-mbct","title":"Mindfulness-based cognitive therapy for chronic tinnitus: RCT","authors":"McKenna L, et al.","journal":"Psychotherapy and Psychosomatics","year":2017,"doi":"10.1159/000478267","url":"https://discovery.ucl.ac.uk/id/eprint/10038974/","n":"75 (MBCT 39, relaxation 36)","design":"RCT vs active control","randomized":true,"sham":false,"independent":true,"control":"Intensity-matched relaxation training (active control — a tougher bar than waitlist)","blinding":"Assessor-blinded","duration":"8 weeks","followUp":"6 months","primaryOutcome":"Tinnitus Questionnaire (co-primary with CORE-NR), between-group adjusted difference","results":{"summary":"MBCT beat active relaxation training by 6.3 TQ points post-treatment (95% CI 1.3–11.4, p=0.016, ES 0.49) and by 7.2 points at 6-month follow-up (95% CI 2.1–12.3, p=0.006, ES 0.56).","detail":"Loudness ratings improved in both arms (non-specific). The reliable-change responder difference (59% vs 44%) was not statistically significant."},"coi":"Academic.","limitations":"Specialist psychology setting; responder-rate difference NS.","pmid":"29131084","history":[{"date":"2026-09-04","change":"Citation-hygiene fix: pmid: None → '29131084'","reason":"PMID filled (verified). (Research-quality audit citation pass.)"}]},{"id":"marks-2023-cbti","title":"CBT for insomnia in tinnitus-related insomnia: RCT","authors":"Marks E, et al.","journal":"Cognitive Behaviour Therapy","year":2023,"doi":"10.1080/16506073.2022.2084155","pmid":"35762946","url":"https://www.tandfonline.com/doi/full/10.1080/16506073.2022.2084155","n":"102","design":"Three-arm RCT","randomized":true,"sham":false,"independent":true,"control":"Sleep support group; audiology-based care (both d tinnitus: systematic review and meta-analysis","authors":"Li Y, Yang H, Niu X, Sun Y","journal":"Diagnostics","year":2024,"doi":"10.3390/diagnostics14182028","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11431415/","n":"853 (28 studies)","design":"Meta-analysis of mostly prospective cohort studies","randomized":false,"sham":false,"independent":true,"primaryOutcome":"THI, TQ, tinnitus VAS (0–10)","results":{"summary":"Pooled within-group improvements after implantation: THI −14.0, TQ −15.9, tinnitus VAS −3.1. Note: the pooled VAS mixes annoyance, loudness, life-effect and awareness bands — it is NOT a pure loudness scale. The percept-level ranges come from Ramakers et al. (Laryngoscope 2015): tinnitus decreases in 25–72% and is completely suppressed in 8–45% of implanted patients — while 0–25% experience worsening.","detail":"Also reported: ~9.2% new-onset tinnitus after implantation (Assouly, cited therein). All pooled changes are pre/post within-group in non-randomized cohorts."},"coi":"Independent.","limitations":"Observational data; implant candidates only; VAS is a mixed tinnitus scale.","history":[{"date":"2026-09-04","change":"Citation-hygiene fix: authors: '—' → 'Li, Yang, Niu, Sun, et al.'","reason":"Authors filled (verified against the publication). (Research-quality audit citation pass.)"},{"date":"2026-09-04","change":"Spurious 'et al.' removed — those four are the complete author list; PMID filled.","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}],"pmid":"39335707"},{"id":"rtms-meta-2025","title":"rTMS for tinnitus: meta-analysis of 16 RCTs","authors":"He Z, et al.","journal":"Frontiers in Neuroscience","year":2025,"doi":"10.3389/fnins.2025.1579846","url":"https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2025.1579846/full","n":"1,105 (16 RCTs)","design":"Meta-analysis","randomized":true,"sham":true,"independent":true,"primaryOutcome":"THI, VAS","results":{"summary":"Active rTMS beat sham post-treatment (THI MD −11.5) and at 1 month (−11.0). At 6 months the two big meta-analyses DISAGREE: this 2025 analysis found no significant effect (MD −4.26, 95% CI −10.28 to 1.76), while the 2020 meta-analysis (29 RCTs, N=1,228; PMID 33228598) found a small significant one (−6.53, 95% CI −11.41 to −1.66).","detail":"Either way, even the significant estimates sit at or below the ~7-point THI clinical-meaningfulness threshold — the durability and magnitude problems are unresolved, not settled in either direction."},"coi":"Independent.","limitations":"High protocol heterogeneity; 6-month durability disputed between meta-analyses.","pmid":"40303608","history":[{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 40303608; authors = He Z, et al.","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"id":"tdcs-meta-2022","title":"Transcranial electrical stimulation for tinnitus: meta-analysis","authors":"Martins ML, et al.","journal":"Neurophysiologie Clinique","year":2022,"pmid":"35027291","url":"https://pubmed.ncbi.nlm.nih.gov/35027291/","n":"14 studies, N=1,031 (tDCS)","design":"Meta-analysis (tDCS studies)","randomized":true,"sham":true,"independent":true,"primaryOutcome":"Loudness and distress measures","results":{"summary":"Small-to-moderate effects on tinnitus measures; overall pooled loudness effect significant (SMD −0.35); subgroup analysis localizes the benefit to lateral-temporal-area stimulation. No significant effect of treatment on psychiatric (depression/anxiety) symptoms. Verdict: possible adjunct, not a standalone treatment.","detail":""},"coi":"Independent.","limitations":"Protocol heterogeneity blocks firm conclusions.","history":[{"date":"2026-09-04","change":"Corrected: removed false claim that prefrontal stimulation 'mainly helped comorbid depression/anxiety' — the paper reports NO significant psychiatric effect; scope corrected to tDCS-only, 14 studies, N=1,031.","reason":"Research-quality audit M2, verified against the publication (PMID 35027291)."},{"date":"2026-09-04","change":"Nuance fix: the abstract reports the OVERALL loudness effect as significant (SMD −0.35); 'only with LTA' is true of the subgroup analysis, not the pooled estimate. Authors filled (Martins ML et al.).","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"id":"tyler-2017-vns","title":"Vagus nerve stimulation paired with tones: randomized double-blind pilot","authors":"Tyler R, et al.","journal":"Scientific Reports","year":2017,"doi":"10.1038/s41598-017-12178-w","url":"https://www.nature.com/articles/s41598-017-12178-w","n":"30","design":"Randomized double-blind controlled pilot (implanted VNS)","randomized":true,"sham":true,"independent":false,"primaryOutcome":"THI","results":{"summary":"At 6 weeks, 50% of paired-VNS participants had clinically meaningful THI improvement vs 28% of controls — a difference NOT statistically significant in the full cohort; benefit concentrated in the tonal, non-blast-induced subgroup.","detail":"The sponsor (MicroTransponder) later pivoted its paired-VNS platform to stroke rehabilitation (Vivistim, FDA PMA 2021); no tinnitus development since."},"coi":"Industry-sponsored (MicroTransponder).","limitations":"Pilot size; invasive; program dormant.","history":[{"date":"2026-09-04","change":"Made explicit that the full-cohort responder difference was not statistically significant (subgroup-driven finding).","reason":"Research-quality audit borderline endpoint-wording pass; verified against the publication."},{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 28931943","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}],"pmid":"28931943"},{"id":"hall-2022-t30","title":"Systematic evaluation of the T30 neurostimulator (acou :"Venous sinus stenting for pulsatile tinnitus: pooled analysis of 28 studies","authors":"Schartz D, Finkelstein A, et al.","journal":"World Neurosurgery","year":2024,"url":"https://www.sciencedirect.com/science/article/abs/pii/S1878875024014074","n":"616 (28 studies)","design":"Pooled analysis of observational studies","randomized":false,"sham":false,"independent":true,"primaryOutcome":"Resolution of pulsatile tinnitus","results":{"summary":"In imaging-confirmed venous-stenosis pulsatile tinnitus: 91.7% improvement, 88.6% complete resolution after stenting.","detail":"Observational only; patient selection is everything. A dedicated stent trial (BosSTENT, NCT07070089, N=90) is registered."},"coi":"Independent.","limitations":"No RCT; selection-dependent.","pmid":"39142383","doi":"10.1016/j.wneu.2024.08.048","history":[{"date":"2026-09-04","change":"Citation completion from re-verification: pmid = 39142383; doi = 10.1016/j.wneu.2024.08.048; authors = Schartz D, Finkelstein A, et al.","reason":"Phase-17 re-verification pass (independent agent, sources quoted in audit-improvement/reverification.md)."}]},{"randomized":true,"sham":false,"independent":true,"results":{"summary":"The largest double-blind sound-therapy RCT. Only 1 of 440 participants reached complete remission. All arms improved (overall THI median 50→35, p<0.0001 — within-group). Between arms (GEE vs unmodified music): the customized DFCRS arm was better by −4.37 THI points [95% CI −6.25, −2.48], p<0.0001 — statistically significant but SMALL; fixed high-frequency enhancement (HFEM) was WORSE than unmodified music (+2.11, p=0.039); narrowband-noise mixing added nothing (p=0.75).","detail":"VAS-loudness fell in ALL arms (DFCRS greater in the first 3 months); the design cannot separate sound-specific benefit from placebo/natural fluctuation — the authors say so explicitly. No multiplicity adjustment. No adverse events in any group. ChiCTR2000039007; Chinese public funding; no competing interests declared. Registered on ChiCTR — invisible to CTgov-only discovery (audit finding)."},"coi":"Independent (public funding; no competing interests declared).","limitations":"No no-treatment/sham arm; placebo effects cannot be excluded; no multiplicity adjustment; adherence not objectively monitored; 3-month posttreatment follow-up; single-region (Shanghai).","id":"most-2025","title":"MOST trial: modified sound therapy, 4-arm double-blind RCT (DFCRS arm)","authors":"Tang D, Gu D, Gong J, et al.","journal":"eClinicalMedicine","year":2025,"doi":"10.1016/j.eclinm.2025.103671","pmid":"41497514","url":"https://pubmed.ncbi.nlm.nih.gov/41497514/","n":"440 randomized (UM 111 / UM+NBN 110 / HFEM 108 / DFCRS 111), all ITT","design":"4-arm multicentre double-blind RCT (participants + clinicians blinded); daily 2-h listening for 9 months; NO no-treatment or sham arm — unmodified music (UM) is the reference","primaryOutcome":"Two-part: complete remission (THI=0 at any visit within 9 months), else THI change baseline→9 months","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":true,"sham":false,"independent":true,"results":{"summary":"All three primary outcomes favored specialised care over 12 months: HUI +0.059 [0.025, 0.094] (d=0.24, p=0.0009); TQ −8.06 [−10.83, −5.30] (d=0.43, p<0.0001); THI −7.51 [−10.66, −4.35] (d=0.45, p<0.0001). Effective across severity strata; no adverse events.","detail":"The foundational trial behind guideline recommendations for CBT-based tinnitus care. Distress/QoL outcomes — no loudness endpoint. Funded by ZonMW (Netherlands)."},"coi":"Independent (public funding).","limitations":"Usual-care comparator (not attention-matched); single country.","id":"cima-2012","title":"Specialised CBT-based stepped care vs usual care (largest CBT trial)","authors":"Cima RFF, Maes IH, Joore MA, et al.","journal":"The Lancet","year":2012,"doi":"10.1016/S0140-6736(12)60469-3","pmid":"22633033","url":"https://pubmed.ncbi.nlm.nih.gov/22633033/","n":"492 randomized (245 specialised / 247 usual care)","design":"RCT, assessor-masked; stepped multidisciplinary CBT-based care vs usual care; NCT00733044","primaryOutcome":"Three co-primaries over 12 months: HUI (quality of life), TQ (severity), THI (impairment)","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":false,"sham":false,"independent":true,"results":{"summary":"RECOMMENDS: hearing-aid evaluation (with hearing loss) and CBT for persistent bothersome tinnitus. OPTION: sound therapy ('may recommend'). AGAINST routine use: medical therapy (antidepressants, anticonvulsants, anxiolytics, intratympanic drugs), dietary supplements (Ginkgo, melatonin, zinc), and rTMS. NO RECOMMENDATION: acupuncture.","detail":"Guidelines are consensus documents, not new trial data. Where the three major guidelines disagree — chiefly on sound therapy (AAO-HNSF: option; NICE and the European guideline: research-only; the German S3 guideline: against sound generators) — this platform shows the disagreement rather than picking a side. Statement strengths read from the published abstracts; full-text verbatim wording not independently re-read."},"coi":"Professional society guideline.","limitations":"US-focused; 2014 evidence base.","id":"guideline-aaohns-2014","title":"AAO-HNSF Clinical Practice Guideline: Tinnitus","authors":"Tunkel DE, Bauer CA, Sun GH, et al.","journal":"Otolaryngology–Head and Neck Surgery","year":2014,"doi":"10.1177/0194599814545325","pmid":"25273878","url":"https://pubmed.ncbi.nlm.nih.gov/25273878/","n":"Guideline (23-author multidisciplinary panel)","design":"Clinical practice guideline (US)","primaryOutcome":"—","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":false,"sham":false,"independent":true,"results":{"summary":"Amplification: OFFER with hearing loss affecting communication; CONSIDER with hearing loss without communication difficulty; DO NOT OFFER without hearing loss. Psychological therapies (stepped): digital tinnitus-related CBT → group interventions (MBCT/ACT/CBT) → individual CBT. Betahistine: 'Do not offer betahistine to treat tinnitus.' Sound therapy and neuromodulation: 'We were unable to make recommendations for practice in this area.'","detail":"Also advises against psychoacoustic pitch/loudness matching for assessment. Read from the official NICE pathway document (NBK557037 mirror). NICE's sound-therapy position (no practice recommendation) conflicts with AAO-HNSF's 'option' — shown as a disagreement, not resolved by this platform."},"coi":"National HTA body.","limitations":"UK service context.","id":"guideline-nice-ng155","title":"NICE guideline NG155: Tinnitus — assessment and management","authors":"National Institute for Health and Care Excellence","journal":"NICE (UK)","year":2020,"pmid":"32437098","url":"https://www.nice.org.uk/guidance/ng155","n":"National guideline","design":"Clinical practice guideline (UK)","primaryOutcome":"—","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":false,"sham":false,"independent":true,"results":{"summary":"CBT: STRONG recommendation FOR. Hearing aids: FOR, with hearing loss. Sound therapy: recommendation for RESEARCH only (no practice recommendation — not an 'against'). Pharmacotherapy: weak recommendation AGAINST. Transcranial electrical stimulation: AGAINST.","detail":"Stances verified via a peer-reviewed secondary source (Langguth et al., J Clin Med 2023, PMC10178961) because the primary full text is paywalled; verbatim wording and grading system therefore marked unable-to-verify. Together with AAO-HNSF 2014 and NICE NG155, the three guidelines agree on CBT (for) and drugs (against) and diverge on sound therapy."},"coi":"Professional societies.","limitations":"Verbatim wording not independently verified (see detail).","id":"guideline-eu-2019","title":"European multidisciplinary guideline for tinnitus","authors":"Cima RFF, Mazurek B, Haider H, et al.","journal":"HNO","year":2019,"doi":"10.1007/s00106-019-0633-7","pmid":"30847513","url":"https://pubmed.ncbi.nlm.nih.gov/30847513/","n":"Multinational guideline","design":"Clinical practice guideline (Europe)","primaryOutcome":"—","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":false,"sham":false,"independent":true,"results":{"summary":"Only ONE eligible RCT (N=91, hearing aids vs sound generators — no difference between devices). Verbatim conclusion: 'there is currently no evidence to support or refute their use as a more routine intervention for tinnitus.'","detail":"This is why the platform labels amplification-SPECIFIC tinnitus evidence as thin even though hearing aids rank #6: the ranking rests on guideline consensus, UNITI subgroup results and observational data, not on dedicated randomized amplification trials."},"coi":"Independent.","limitations":"Single small included trial.","id":"hoare-2014-cochrane-ha","title":"Cochrane: amplification with hearing aids for tinnitus (CD010151)","authors":"Hoare DJ, Edmondson-Jones M, Sereda M, Akeroyd MA, Hall D","journal":"Cochrane Database of Systematic Reviews","year":2014,"doi":"10.1002/14651858.CD010151.pub2","pmid":"24482186","url":"https://pubmed.ncbi.nlm. eted hearing restoration, and no tinnitus outcome measure was found in any FX-322 publication or coverage reviewed (the published Phase 1b reported none) — claims that tinnitus was measured are unable-to-verify. The failure matters to the regenerative-medicine pipeline narrative, not to any tinnitus evidence rating."},"coi":"Company-reported.","limitations":"Company topline; full peer-reviewed publication of the Phase 2b not reviewed.","id":"fx322-2023","title":"FX-322 (regenerative hair-cell program): Phase 2b failure and program discontinuation","authors":"Frequency Therapeutics (company communications)","journal":"Company announcement / trade press","year":2023,"url":"https://www.drugdiscoverytrends.com/frequency-therapeutics-shares-plummet-after-fx-322-phase-2b-failure/","n":"142 (Phase 2b FX-322-208)","design":"Phase 2b randomized placebo-controlled (hearing restoration)","primaryOutcome":"Speech perception at day 90 (hearing outcome — NOT a tinnitus endpoint)","history":[{"date":"2026-09-04","change":"Record added.","reason":"Research-quality improvement phase — audit-identified coverage gap; extraction verified against sources (see audit-improvement/acquisition-report.md)."}]},{"randomized":false,"sham":false,"independent":true,"results":{"summary":"Verbatim conclusion: 'There is as yet insufficient evidence to say that antidepressant drug therapy improves tinnitus.'","detail":"Distinct from treating comorbid depression, which can itself be worthwhile."},"coi":"Independent.","limitations":"Trial quality low; heterogeneous drugs.","id":"cochrane-antidepressants-2012","title":"Cochrane: antidepressants for tinnitus (CD003853)","authors":"Baldo P, et al.","journal":"Cochrane Database of Systematic Reviews","year":2012,"doi":"10.1002/14651858.CD003853.pub3","pmid":"22972065","url":"https://pubmed.ncbi.nlm.nih.gov/22972065/","n":"6 trials, 610 patients","design":"Cochrane systematic review","primaryOutcome":"—","history":[{"date":"2026-09-04","change":"Record adde
