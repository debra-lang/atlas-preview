bjective brain-response marker of who responds to bimodal stimulation.","country":"USA"},{"nctId":"NCT07185061","title":"Interventional acoustic stimulation for chronic tinnitus","treatment":"sound-therapy","phase":"N/A (device)","status":"Recruiting","sponsor":"First Affiliated Hospital, Nanjing Medical University","n":200,"completionEst":"Jul 2027","watch":false,"whyItMatters":"Large acoustic-stimulation trial.","country":"China"}],"institutions":[{"id":"umich-kresge","name":"University of Michigan — Kresge Hearing Research Institute","location":"Ann Arbor, Michigan, USA","focus":"Susan Shore's lab developed targeted bimodal auditory-somatosensory stimulation; in her double-blinded crossover trial more than 60% of participants had meaningful symptom reduction after 6 weeks of active treatment. Shore co-founded Auricle Inc. to commercialize the device.","researchers":["Susan Shore","David Martel"],"treatments":["shore-bimodal"],"url":"https://www.michiganmedicine.org/health-lab/study-shows-promising-treatment-tinnitus"},{"id":"tcd-neuromod","name":"Trinity College Dublin / Neuromod Devices","location":"Dublin, Ireland","focus":"Brendan Conlon (TCD/Neuromod) and CSO Hubert Lim ran the TENT-A1/A2/A3 bimodal sound + tongue stimulation trials behind Lenire, the first device FDA De Novo authorized for tinnitus (March 2023). TCD began recruiting the NITESGON-ADT bimodal trial in January 2026.","researchers":["Brendan Conlon","Hubert Lim"],"treatments":["lenire"],"url":"https://www.tcd.ie/research/profiles/?profile=conlonbr"},{"id":"regensburg","name":"University of Regensburg / Tinnitus Research Initiative","location":"Regensburg, Germany","focus":"Berthold Langguth's group is a hub of the Tinnitus Research Initiative and coordinated the EU UNITI-RCT (N=461, five countries; Nature Communications 2025) — the largest trial comparing single versus combined tinnitus treatments.","researchers":["Berthold Langguth","Stefan Schoisswohl"],"treatments":["cbt","hearing-aids","sound-therapy"],"url":"https://www.nature.com/articles/s41467-025-66165-1"},{"id":"auckland","name":"University of Auckland — Hearing & Tinnitus Research","location":"Auckland, New Zealand","focus":"Grant Searchfield's group developed the 'digital polytherapeutic' personalized sound-therapy approach (RCT 2022). In August 2026 the university spun the 30-year research program into startup TrueSilence Therapeutics, delivering clinician-guided 90-day programs via smartphone.","researchers":["Grant Searchfield"],"treatments":["truesilence"],"url":"https://www.auckland.ac.nz/en/news/2026/08/25/how-30-years-of-tinnitus-research-became-a-start-up.html"},{"id":"karolinska","name":"Karolinska Institutet","location":"Stockholm, Sweden","focus":"Christopher Cederroth's Translational Auditory Neuroscience group leads tinnitus genetics and epidemiology, including the TIGER consortium and a 2025 GWAS meta-analysis implicating amygdala and midbrain circuits, plus work on sex differences in tinnitus.","researchers":["Christopher Cederroth"],"treatments":[],"url":"https://ki.se/en/research/research-areas-centres-and-networks/research-groups/translational-auditory-neuroscience-christopher-cederroths-research-group"},{"id":"utrecht","name":"UMC Utrecht","location":"Utrecht, Netherlands","focus":"The Stokroos group researches tinnitus subtyping and cochlear implantation for tinnitus — in a 72-patient prospective study, 60% of implanted tinnitus patients had clinically significant reduction at 3 months — alongside neuromodulation, CBT and mindfulness work.","researchers":["Robert Stokroos","Adriana Smit"],"treatments":["cochlear-implants"],"url":"https://www.umcutrecht.nl/en/group-stokroos"},{"id":"nottingham","name":"NIHR Nottingham Biomedical Research Centre","location":"Nottingham, UK","focus":"Derek Hoare leads the hearing theme covering tinnitus and hyperacusis; current work includes closing the gap between CBT evidence and NHS audiologist-delivered care, cochlear-implant tinnitus research, and wearable-device evaluation (WHITBY tDCS trial).","researchers":["Derek Hoare"],"treatments":["cbt","tdcs"],"url":"https://nottinghambrc.nihr.ac.uk/research/hearing/67-tinnitus-and-hyperacusis"},{"id":"oxford","name":"University of Oxford","location":"Oxford, UK","focus":"The Institute of Biomedical Engineering (Robin Cleveland) runs a Tinnitus Quest-funded transcranial ultrasound stimulation project targeting deep-brain tinnitus circuits; Oxford neuroscientists also lead research linking non-REM slow-wave sleep to tinnitus suppression.","researchers":["Robin Cleveland"],"treatments":[],"url":"https://www.prnewswire.com/news-releases/tinnitus-quest-builds-momentum-with-oxford-research-study-new-funding-call-and-second-tinnitus-hackathon-302803520.html"},{"id":"nidcd","name":"NIDCD (National Institute on Deafness and Other Communication Disorders)","location":"Bethesda, Maryland, USA","focus":"The lead US federal funder of hearing and tinnitus research (estimating more than 25 million US adults with tinnitus). Funds tinnitus R01 grants, SBIR programs, fellowships and clinical research centers — including the NIH funding behind the Shore bimodal trial.","researchers":[],"treatments":["shore-bimodal"],"url":"https://www.nidcd.nih.gov/funding"},{"id":"sound-pharma","name":"Sound Pharmaceuticals","location":"Seattle, Washington, USA","focus":"Developer of SPI-1005 (oral ebselen). Its STOPMD-3 Phase 3 in Meniere's disease met co-primary endpoints (company-reported, Dec 2024) with patient-reported tinnitus improvement in the open-label extension, and received FDA Breakthrough Therapy designation in December 2025.","researchers":[],"treatments":["spi-1005"],"url":"https://www.businesswire.com/news/home/20241210989946/en/Sound-Pharma-Announces-Positive-Phase-3-Results-for-the-Treatment-of-Menieres-Disease-with-SPI-1005"}],"rankings":{"updated":"2026-09-03","top":[{"rank":1,"id":"cbt","why":"The reference standard. Largest body of controlled evidence of any tinnitus treatment (Cochrane 2020: 28 studies, 2,733 participants), guideline-recommended, safe, and confirmed by the 2025 UNITI trial as among the most effective single treatments.","detail":{"strongest":"Cochrane 2020 meta-analysis (28 RCTs, N=2,733): consistent quality-of-life benefit vs every comparator; UNITI 2025 head-to-head confirmation.","weakest":"No effect on loudness; most underlying trials are low-certainty with little long-term follow-up.","studies":"28 randomized trials in the Cochrane review plus UNITI (N=461) and multiple iCBT RCTs.","replication":"Extensive — replicated across countries, formats and independent groups for two decades.","loudness":"None shown — Cochrane found only 'generally weak (if any)' loudness effects.","distress":"Strong — SMD −0.56 vs no treatment (≈11 THI points lower), the field's most reliable effect.","availability":"Available now through psychologists and digital programs; access limited mainly by therapist supply.","uncertainty":"Whether benefits persist long-term after therapy ends (few 6–12-month follow-ups)."},"couldChange":"Would drop only if a treatment shows durable loudness reduction in large independent RCTs; could rise in absolute impact as digital delivery widens access.","whyPlain":"Most-tested treatment in the field + recommended by medical guidelines + available now. Helps how much tinnitus bothers you, not the volume.","stability":"stable-top","stabilityNote":"Ranked #1 in five of six weighting schemes; drops (to ~#4) only if loudness reduction alone is weighted."},{"rank":2,"id":"lenire","why":"Authorized, available, and consistent across three large trials and two real-world cohorts — which outweighs any single unreplicated trial, even though no Lenire study has ever had a sham arm and all of them are manufacturer-funded.","detail":{"strongest":"Three large trials (N=326/191/112) plus two US real-world cohorts showing consistent within-arm THI improvement; FDA De Novo authorization DEN210033 (the only device in the bimodal tinnitus-treatment class).","weakest":"No trial has ever included a sham or no-treatment arm, and the pivotal trial's full-cohort primary endpoint was NOT achieved — the authorization rests on the moderate-or-worse subgroup.","studies":"TENT-A1, TENT-A2, TENT-A3 and two US chart reviews — every one manufacturer-funded or manufacturer-linked.","replication":"Replicated across its own cohorts, but nothing independent — an academic bimodal trial (Trinity College Dublin, NCT07393880) is recruiting.","loudness":"None shown — all endpoints are THI, a distress/handicap instrument.","distress":"Moderate — consistent within-arm improvements; sham-free designs mean placebo/natural course can't be excluded.","availability":"Available by prescription in the US (≈$4,000 self-pay, rarely insured) and Europe.","uncertainty":"How much of the effect is placebo/natural course — unanswerable without a sham-controlled trial."},"couldChange":"An independent sham-controlled RCT confirming benefit would cement it; failure to separate from sound therapy in independent hands would drop it.","whyPlain":"Replicated clinical results + FDA authorization + currently available. Caveat: every study was company-funded, none had a placebo group.","stability":"weighting-sensitive","stabilityNote":"Falls up to 8 places if conflict-of-interest weighting is applied (all efficacy evidence is sponsor-run) and ~6 under strict quality weighting. Its position also reflects real-world availability (FDA De Novo authorization, clinics operating) — availability is part of 'promising', but readers should know the science pillar is sponsor-dependent."},{"rank":3,"id":"shore-bimodal","why":"The only tinnitus treatment with rigorous randomized evidence of reducing the tinnitus percept itself — loudness matching was a CO-PRIMARY endpoint, double-blinded and NIH-funded. Held below Lenire because it is one single-center trial, in one subtype, with no replication, no registered pivotal trial, and no visible path to market.","detail":{"strongest":"Double-blind randomized crossover (JAMA Network Open 2023, N=99): co-primary loudness matching improved up to −14.1 dB (per-protocol, cumulative) alongside clinically meaningful TFI reduction, vs an active auditory-only control.","weakest":"Single-center, somatic-tinnitus subtype only, per-protocol n=56, and zero regulatory or commercial progress since 2023.","studies":"One pilot (N=20, 2018) and one main crossover RCT (N=99, 2023), both from the same lab.","replication":"None — no independent replication anywhere.","loudness":"The strongest percept-level result in any tinnitus RCT (dB-matched loudness, co-primary endpoint).","distress":"TFI −13.2 per-protocol; 65% PP / 53% ITT responders vs 25%/20% control.","availability":"Not available anywhere; no trial sponsored by Auricle Inc is registered.","uncertainty":"Whether it ever reaches a pivotal trial, and whether results generalize beyond somatic tinnitus."},"couldChange":"A registered pivotal trial or FDA submission would push it up; continued company silence or a failed replication would drop it further.","whyPlain":"Strongest evidence that anything can make tinnitus QUIETER — but one lab, one study, and you can't get it anywhere.","stability":"weighting-sensitive","stabilityNote":"Falls ~6 places under conflict-of-interest weighting (inventor-led trials) and ~5 under replication weighting (no independent replication yet)."},{"rank":4,"id":"digital-cbt","why":"CBT's evidence, delivered at scale. Kalmeda RCT (N=187, d=1.1 vs delayed treatment), the first double-blind sham-app-controlled trial (Japan 2026: THI −20.4 between groups), Oto RCTs, and Germany's DiGA listing make this the fastest-maturing category.","detail":{"strongest":"Multiple positive RCTs across independent products, including the first double-blind sham-app-controlled trial (JAMA Otolaryngology 2026, per its authors).","weakest":"Category is heterogeneous — most apps on the market have no evidence; key trials are small, waitlist-controlled, or manufacturer-sponsored.","studies":"Kalmeda (N=187), Kyorin sham-controlled (N=60), Oto (N=96), Beukes iCBT (N=158), plus others.","replication":"Good at category level (several independent products/groups); limited per-product.","loudness":"None shown — all primary outcomes are distress instruments.","distress":"Strong — but note control types differ: d=1.1 was against delayed treatment, not sham.","availability":"Available now via app stores; Kalmeda prescribable in Germany; SilentCloud 510(k)-cleared (as a masker).","uncertainty":"The unpublished DEFINE trial (app vs human therapist) will show whether apps can substitute for clinicians."},"couldChange":"Peer-reviewed publication of the DEFINE non-inferiority trial could push it up; failed replications would trim it.","whyPlain":"Well-supported therapy delivered by phone. Multiple trials, one against a convincing fake app. Available today, often cheap.","stability":"stable","stabilityNote":"Robust across all six weighting schemes tested."},{"rank":5,"id":"cochlear-implants","why":"For people with severe hearing loss who qualify, CI is one of the few interventions with percept-level effects: tinnitus decreases in 25–72% of implanted patients and is completely suppressed in 8–45% (Ramakers 2015); pooled THI −14.0 across 28 studies.","detail":{"strongest":"2024 meta-analysis of 28 studies (N=853) plus consistent replication across many independent implant centers, covering both distress and percept-level ratings.","weakest":"All observational — nobody is randomized to implantation for tinnitus; benefit is entangled with hearing restoration; 0–25% worsen and ~9% develop new-onset tinnitus.","studies":"28 cohort studies pooled; prospective series (e.g., UMC Utrecht) ongoing.","replication":"Consistent across many independent centers.","loudness":"Moderate — complete suppression in 8–45% of patients across studies (percept-level).","distress":"Moderate — pooled within-group THI −14.0, TQ −15.9.","availability":"Available and usually insurance-covered — but only for qualifying severe hearing loss.","uncertainty":"Who improves vs who worsens, and durability over years."},"couldChange":"Applies only to implant candidates; better prediction of who improves (and who worsens) would strengthen its position.","whyPlain":"Often genuinely quiets tinnitus — but only for people who already qualify for an implant due to severe hearing loss.","stability":"weighting-sensitive","stabilityNote":"Moves up ~4 places if loudness outcomes are weighted, down ~4 under strict trial-quality weighting (evidence is observational/meta-analytic, not randomized for tinnitus)."},{"rank":6,"id":"hearing-aids","why":"Guideline-recommended ('Recommendation' strength) when hearing loss accompanies tinnitus; in the 2025 UNITI trial hearing aids were among the largest single-treatment effects. Honest basis: guideline consensus plus UNITI — Cochrane found the placebo-controlled evidence insufficient.","detail":{"strongest":"UNITI 2025 (N=461): among the largest single-treatment effects; AAO-HNSF 'Recommendation' (middle strength tier — sound therapy gets only 'Option').","weakest":"Cochrane 2018: insufficient controlled evidence; tinnitus benefit hard to separate from hearing benefit.","studies":"UNITI head-to-head plus a large observational literature; thin on placebo-controlled designs.","replication":"Widely replicated observationally.","loudness":"Limited — reduced audibility/awareness reported; controlled percept evidence weak.","distress":"Moderate — consistent severity reductions when hearing loss coexists (consensus + UNITI, low-certainty trial base).","availability":"Widely available; OTC from ~$200 (incl. FDA-authorized AirPods hearing-aid software since 2024).","uncertainty":"How much is tinnitus-specific vs simply hearing better."},"couldChange":"A well-controlled trial isolating the tinnitus effect from the hearing benefit would settle the score either way.","whyPlain":"If you have hearing loss, treating it is one of the most effective moves — guideline-recommended and easy to access.","stability":"weighting-sensitive","stabilityNote":"Falls ~4 places under strict quality weighting — amplification-specific RCT evidence is thin."},{"rank":7,"id":"cbt-i","why":"Insomnia affects most people with bothersome tinnitus; a 2023 RCT (N=102) showed clinically meaningful insomnia improvement in >80% with CBT-I vs 47% and 20% in two active control arms, with tinnitus distress improving too.","detail":{"strongest":"Well-designed three-arm RCT against ACTIVE controls with effects sustained at 6 months.","weakest":"Single center, single trial; tinnitus outcomes were secondary.","studies":"One adequately powered RCT (UCL/Barts 2023) plus strong imported evidence from the general insomnia literature.","replication":"Not yet replicated in tinnitus populations.","loudness":"None claimed.","distress":"Moderate — large insomnia effect; tinnitus distress (secondary) improved and held at 6 months.","availability":"Available through sleep clinics and digital CBT-I programs.","uncertainty":"Whether results generalize beyond the single UK center."},"couldChange":"Replication outside the single UK center would raise confidence.","whyPlain":"If tinnitus wrecks your sleep, treating the insomnia works — one strong trial against real alternatives.","stability":"stable","stabilityNote":"Robust across all six weighting schemes tested."},{"rank":8,"id":"act","why":"Pooled THI reduction of −17.7 points vs untreated controls across 3 RCTs; a plausible, safe alternative to classic CBT with growing evidence.","detail":{"strongest":"Meta-analysis of 3 RCTs: pooled THI −17.7 (95% CI −23.5 to −11.8); Westin 2011 d=1.04 vs waitlist.","weakest":"Only ~100 pooled participants; comparisons are mostly against no treatment.","studies":"3 randomized trials pooled, from more than one group.","replication":"Some — Swedish and later international trials.","loudness":"None shown.","distress":"Moderate — large effects vs untreated controls.","availability":"Available where ACT-trained therapists exist; some digital versions.","uncertainty":"Performance against active controls and at scale."},"couldChange":"Larger independent trials; currently ~100 pooled participants.","whyPlain":"A well-studied CBT relative built on acceptance instead of struggle. Fewer studies, consistent results.","stability":"weighting-sensitive","stabilityNote":"Rises ~3 places under durability weighting; replication is largely one research network."},{"rank":9,"id":"mbct","why":"Best-tested mindfulness approach: MBCT beat an intensity-matched active relaxation control by 6.3 TQ points post-treatment and 7.2 points at 6-month follow-up — a tougher comparison than most of this field attempts.","detail":{"strongest":"Beat an ACTIVE control with a durable effect (6.3 points post, 7.2 at 6 months) — rare in this field.","weakest":"One main RCT (N=75); the reliable-change responder difference (59% vs 44%) was not statistically significant.","studies":"McKenna 2017 RCT plus smaller mindfulness trials.","replication":"Limited; an online iMBCT RCT is underway (Warsaw).","loudness":"None — loudness ratings improved equally in both arms (non-specific).","distress":"Moderate — TQ −6.3/−7.2 vs active control.","availability":"Generic MBCT is widespread; tinnitus-specific programs are rarer.","uncertainty":"Whether the effect survives online delivery and non-specialist settings."},"couldChange":"Multicenter replication; results are from specialist psychology settings.","whyPlain":"Best-tested mindfulness approach — outperformed a genuine comparison treatment (not just a waiting list), and the benefit lasted six months.","stability":"weighting-sensitive","stabilityNote":"Rises ~4 places under durability weighting; small evidence base."},{"rank":10,"id":"rtms","why":"The honest #10: by sheer volume of sham-controlled evidence (29 RCTs, N=1,228 in the 2020 meta-analysis), rTMS outranks any pipeline drug with zero controlled tinnitus data. Framed plainly: consistent short-term benefit over sham; durability disputed; effect sizes at or below clinical meaningfulness; not guideline-recommended.","detail":{"strongest":"More sham-controlled RCT evidence than any other treatment on this list except CBT: THI −11.5 vs sham post-treatment (2025 meta, 16 RCTs, N=1,105).","weakest":"Durability: the 2020 meta found a small significant 6-month effect (−6.53), the stricter 2025 meta found none (−4.26, NS) — and both sit at/below the ~7-point meaningfulness threshold.","studies":"29 RCTs (2020 meta) / 16 RCTs (2025 meta), independent academic groups worldwide.","replication":"Extensively replicated for the short-term effect; that is exactly why it earns the slot.","loudness":"None — loudness/psychoacoustic effects inconsistent.","distress":"Limited — real but small and possibly transient.","availability":"Off-label at some centers; research settings; AAO-HNSF recommends against routine use.","uncertainty":"Whether navigated/personalized targeting (trials now recruiting) fixes the durability problem."},"couldChange":"A navigated-rTMS trial with durable 6-month benefit would move it up; another null durability meta would drop it out.","whyPlain":"Magnetic brain stimulation — tested against a fake version of the device more than anything else here. Real short-term relief in trials, but small, possibly temporary, and not routine doctor-recommended care.","stability":"weighting-sensitive","stabilityNote":"Rises up to 7 places under quality/replication weighting (many sham-controlled trials exist) — but held back here because independent results conflict (Folmer positive vs Landgrebe negative) and effects fade; trial VOLUME is not the same as durable, consistent benefit."}],"history":[{"date":"2026-09-03","note":"Initial Top-10 established at launch from the verified evidence base.","snapshot":[{"rank":1,"id":"cbt","evidenceScore":4},{"rank":2,"id":"shore-bimodal","evidenceScore":3},{"rank":3,"id":"lenire","evidenceScore":3},{"rank":4,"id":"digital-cbt","evidenceScore":3},{"rank":5,"id":"cochlear-implants","evidenceScore":3},{"rank":6,"id":"hearing-aids","evidenceScore":3},{"rank":7,"id":"cbt-i","evidenceScore":3},{"rank":8,"id":"act","evidenceScore":3},{"rank":9,"id":"mbct","evidenceScore":3},{"rank":10,"id":"spi-1005","evidenceScore":2}]},{"date":"2026-09-03","note":"Phase 2 adversarial audit: Lenire and Shore/Auricle swapped (#2↔#3 — replication, authorization and availability outweigh one unreplicated trial; the old order was novelty bias). SPI-1005 removed from #10 (zero controlled tinnitus data — pipeline hype) and replaced by rTMS (29 sham-controlled RCTs, honestly framed). Every underlying claim re-verified against primary sources.","snapshot":[{"rank":1,"id":"cbt","evidenceScore":4},{"rank":2,"id":"lenire","evidenceScore":3},{"rank":3,"id":"shore-bimodal","evidenceScore":3},{"rank":4,"id":"digital-cbt","evidenceScore":3},{"rank":5,"id":"cochlear-implants","evidenceScore":3},{"rank":6,"id":"hearing-aids","evidenceScore":3},{"rank":7,"id":"cbt-i","evidenceScore":3},{"rank":8,"id":"act","evidenceScore":3},{"rank":9,"id":"mbct","evidenceScore":3},{"rank":10,"id":"rtms","evidenceScore":2}]},{"date":"2026-09-04","note":"No rank order changes. Added ranking-uncertainty communication: stability labels from a six-scheme weighting stress test, a page-level uncertainty note, and a documented exclusion rationale for venous sinus stenting.","top":["cbt","lenire","shore-bimodal","digital-cbt","cochlear-implants","hearing-aids","cbt-i","act","mbct","rtms"]}],"uncertaintyNote":"Rankings depend on how evidence dimensions are weighted. In our stress test of six reasonable weighting schemes, only two positions were fully stable (digital CBT programs and CBT for insomnia); CBT ranked #1 in five of six schemes. Positions marked 'weighting-sensitive' can move several places under defensible alternative weightings — treat the order as a guide, not a verdict.","exclusions":[{"id":"venous-stenting","note":"Venous sinus stenting scores strongly on several evidence dimensions but is excluded from this Top-10 because it applies only to a specific vascular subtype of pulsatile tinnitus (venous sinus stenosis), requires an invasive procedure with real complication risk, and its evidence is uncontrolled case series — a general most-promising list would mislead the overwhelming majority of readers, whose tinnitus is not of this type. It is covered fully on its own page."}]},"weeklyIndex":{"reports":[{"date":"2026-09-04","file":"2026-09-04.json","title":"Automated weekly scan — 1 update(s)"},{"date":"2026-09-03","file":"2026-09-03.json","title":"Launch edition — the state of the field, September 2026"}]},"weeklyAll":{"2026-09-04.json":{"date":"2026-09-04","title":"Automated weekly scan — 1 update(s)","automated":true,"items":[{"kind":"news","treatment":"","importance":"Does Not Change Current Evidence","title":"No evidence-changing tinnitus research identified in this week's scan","whyMatters":"Quiet weeks happen. The sources below were checked; nothing met the bar for a meaningful update, and we would rather say so than manufacture a story.","summary":"Sources checked: PubMed, ClinicalTrials.gov, Watched feeds (FDA, NIH/NIDCD, journals, EMA…).","url":"","detail":{"changesAssessment":"No."}}]},"2026-09-03.json":{"date":"2026-09-03","title":"Launch edition — the state of the field, September 2026","headline":{"title":"CBT confirmed as the benchmark; the interesting fights are over loudness","summary":"The 2025 UNITI mega-trial (N=461) confirmed CBT and hearing aids as the strongest single treatments — and that combining treatments adds little. Meanwhile the only rigorous loudness-reduction evidence (the Shore/Auricle bisensory device) remains stuck without a registered pivotal trial, and the drug pipeline has exactly two Phase 2+ trials targeting tinnitus as the primary indication.","url":"https://www.nature.com/articles/s41467-025-66165-1"},"items":[{"kind":"trial","treatment":"tavns","title":"Trial status change: NCT05417711 is now 'Unknown status'","importance":"Does Not Change Current Evidence","whyMatters":"The registry entry for this trial moved from 'Ongoing (larger successor trial registered)' to 'Unknown status'. Status changes are verified directly against ClinicalTrials.gov.","summary":"taVNS paired with tailor-made notched music (double-blind RCT) — sponsor Sun Yat-Sen Memorial Hospital. Status verified at the registry on 2026-09-03.","url":"https://clinicaltrials.gov/study/NCT05417711","detail":{"identifier":"NCT05417711","source":"ClinicalTrials.gov (authoritative registry)","changesAssessment":"No — trial status only."}},{"kind":"trial","treatment":"","title":"Trial status change: NCT07655440 is now 'Not yet recruiting'","importance":"Does Not Change Current Evidence","whyMatters":"The registry entry for this trial moved from 'Registered' to 'Not yet recruiting'. Status changes are verified directly against ClinicalTrials.gov.","summary":"Anti-CGRP monoclonals (galcanezumab/erenumab) for tinnitus with migraine features — sponsor Stanford University. Status verified at the registry on 2026-09-03.","url":"https://clinicaltrials.gov/study/NCT07655440","detail":{"identifier":"NCT07655440","source":"ClinicalTrials.gov (authoritative registry)","changesAssessment":"No — trial status only."}},{"kind":"trial","treatment":"venous-stenting","title":"Trial status change: NCT07070089 is now 'Recruiting'","importance":"Does Not Change Current Evidence","whyMatters":"The registry entry for this trial moved from 'Registered' to 'Recruiting'. Status changes are verified directly against ClinicalTrials.gov.","summary":"BosSTENT dedicated venous stent for pulsatile tinnitus — sponsor Sonorous NV. Status verified at the registry on 2026-09-03.","url":"https://clinicaltrials.gov/study/NCT07070089","detail":{"identifier":"NCT07070089","source":"ClinicalTrials.gov (authoritative registry)","changesAssessment":"No — trial status only."}},{"kind":"trial","treatment":"","title":"Trial status change: NCT07071480 is now 'Recruiting'","importance":"Does Not Change Current Evidence","whyMatters":"The registry entry for this trial moved from 'Registered' to 'Recruiting'. Status changes are verified directly against ClinicalTrials.gov.","summary":"Mild therapeutic hypothermia (mastoid cooling) for tinnitus — sham-controlled — sponsor Restorear Devices. Status verified at the registry on 2026-09-03.","url":"https://clinicaltrials.gov/study/NCT07071480","detail":{"identifier":"NCT07071480","source":"ClinicalTrials.gov (authoritative registry)","changesAssessment":"No — trial status only."}},{"kind":"trial","treatment":"cochlear-implants","title":"Trial status change: NCT06641999 is now 'Recruiting'","importance":"Does Not Change Current Evidence","whyMatters":"The registry entry for this trial moved from 'Registered' to 'Recruiting'. Status changes are verified directly against ClinicalTrials.gov.","summary":"Dedicated tinnitus implant evaluation — sponsor Cochlear Ltd. Status verified at the registry on 2026-09-03.","url":"https://clinicaltrials.gov/study/NCT06641999","detail":{"identifier":"NCT06641999","source":"ClinicalTrials.gov (authoritative registry)","changesAssessment":"No — trial status only."}},{"kind":"ranking","treatment":"lenire","title":"Phase 2 audit: two ranking changes, fully documented","summary":"After an adversarial re-verification of every Top-10 claim against primary sources: Lenire and the Shore/Auricle device swapped places (#2↔#3 — replication, FDA authorization and availability outweigh one unreplicated single-center trial), and SPI-1005 left the Top 10 in favor of rTMS (29 sham-controlled RCTs beat zero controlled tinnitus data). Full reasoning is on each treatment's page under 'Change history'.","url":"","importance":"Does Not Change Current Evidence","whyMatters":"We re-checked our own claims and reordered two rankings. The underlying science didn't change — our honesty about it got sharper."},{"kind":"study","treatment":"digital-cbt","title":"First double-blind sham-app-controlled tinnitus RCT (JAMA Otolaryngology, online May 7, 2026)","summary":"Japanese 3-center trial (Wasano et al., N=60, Kyorin-sponsored): at week 16, THI fell 16.8 points with the active app vs a 3.6-point rise with sham — a 20.4-point difference, with 70% vs 27% meaningfully improved. Per the authors, the first DOUBLE-BLIND sham-app-controlled trial (earlier app RCTs were single-blind). Small and industry-sponsored.","url":"https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2848394","importance":"Potentially Important","whyMatters":"For the first time, a tinnitus app beat a fake look-alike app in a trial where nobody knew which was which. Small study, but the cleanest app result yet."},{"kind":"study","treatment":"lenire","title":"Second US real-world Lenire chart review published (Am J Audiology, 2026)","summary":"N=140, single site: 81.8% of bothered-tinnitus patients improved ≥7 THI points (mean −23.8) at 12 weeks. Consistent with trials — but retrospective, uncontrolled and manufacturer-linked, so it cannot separate treatment effect from placebo and natural course.","url":"https://pubs.asha.org/doi/10.1044/2025_AJA-25-00090","importance":"Confirms Previous Evidence","whyMatters":"More patients improving in real clinics is encouraging — but without a comparison group, this can't tell us how much is the device vs time and expectation."},{"kind":"trial","treatment":"trtl-913","title":"New drug entrant: Tortugas Neuroscience registers Phase 2a for TRTL-913","summary":"The $106M startup (launched April 2026) registered a 100-participant Phase 2a of its GABA-A positive allosteric modulator — not yet recruiting (estimated start Sept 2026), and Part A doses healthy volunteers before Part B reaches tinnitus patients. Still: one of only two Phase 2+ drug programs with tinnitus as the primary indication. Estimated completion August 2027.","url":"https://clinicaltrials.gov/study/NCT07777549","importance":"Interesting but Early","whyMatters":"A well-funded company is betting on a new tinnitus drug, but no tinnitus patient has taken it in a trial yet."},{"kind":"trial","treatment":"spi-1005","title":"SPI-1005 (ebselen) completes enrollment in open-label Phase 3 safety study","summary":"Sound Pharmaceuticals finished enrolling ~200 patients in July 2026; primary completion December 2026. Tinnitus remains a secondary, patient-reported outcome in a Meniere's population — watch for the first peer-reviewed publication of STOPMD-3.","url":"https://www.businesswire.com/news/home/20260714809135/en/Sound-Pharma-completes-enrollment-of-Open-Label-Phase-3-study-of-SPI-1005-in-Menieres-Disease","importance":"Interesting but Early","whyMatters":"The most advanced drug with tinnitus outcomes moved a step forward — but its tinnitus data remain unblinded and unpublished, and its disease is Meniere's, not ordinary tinnitus."},{"kind":"news","treatment":"truesilence","title":"University of Auckland spins out TrueSilence Therapeutics (announced Aug 25, 2026)","summary":"Grant Searchfield's 30-year research program becomes an Atlanta-based startup (technical staff in NZ) delivering personalized, gamified sound therapy (QCore) in clinician-guided 90-day programs — rolling out via NZ audiologists while pursuing US approval. This is company news, not new clinical evidence: the supporting RCT is the 2022 prototype trial (TFI −17.8 vs −10.1 against a white-noise app).","url":"https://www.auckland.ac.nz/en/news/2026/08/25/how-30-years-of-tinnitus-research-became-a-start-up.html","importance":"Interesting but Early","whyMatters":"A respected 30-year research program became a company. That's business news — the product itself hasn't been tested in a trial yet."},{"kind":"regulatory","treatment":"levo","title":"Two new tinnitus-masker 510(k) clearances in 2026","summary":"Levo Gen 2 (K260413, Levo Medical Corp., August) and a Sivantos 'Tinnitus Therapy' hearing-aid module (K260614, June) were both FDA-cleared this year — under the tinnitus MASKER regulation (874.3400). Reminder: 510(k) clearance means substantial equivalence to existing maskers, not proven efficacy.","url":"https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfPMN/pmn.cfm","importance":"Does Not Change Current Evidence","whyMatters":"Two more sound-therapy devices were cleared, but clearance means 'similar to existing devices,' not 'proven to work.'"},{"kind":"regulatory","treatment":"cbt","title":"AAO-HNSF tinnitus guideline update is in development","summary":"The 2014 clinical practice guideline — still the current US standard — is officially listed as being updated. Publication timing is unconfirmed. Expect the CBT recommendation to strengthen and new language on bimodal devices and apps.","url":"https://www.entnet.org/quality-practice/quality-products/clinical-practice-guidelines/","importance":"Potentially Important","whyMatters":"When the official US guideline updates, it will reset what doctors are told to recommend — the first refresh since 2014."},{"kind":"negative","treatment":"shore-bimodal","title":"Still no pivotal trial for the Shore/Auricle device (checked September 2026)","summary":"Three years after its JAMA Network Open results, no trial sponsored by Auricle Inc is registered on ClinicalTrials.gov, no FDA submission is visible, and the company has declined to comment on timing since October 2025. (Don't confuse it with 'Auricle Health Inc', an unrelated company running a hearing-restoration study.) The strongest loudness evidence in the field remains commercially frozen — a key reason it dropped to #3 in this audit.","url":"https://www.tinnitushub.com/dr-susan-shore-auricle-questions-answers/","importance":"Negative Result","whyMatters":"The only treatment with rigorous evidence of making tinnitus quieter still has no path to reaching patients — three years and counting."}],"automated":true}},"weekly":{"date":"2026-09-04","title":"Automated weekly scan — 1 update(s)","automated":true,"items":[{"kind":"news","treatment":"","importance":"Does Not Change Current Evidence","title":"No evidence-changing tinnitus research identified in this week's scan","whyMatters":"Quiet weeks happen. The sources below were checked; nothing met the bar for a meaningful update, and we would rather say so than manufacture a story.","summary":"Sources checked: PubMed, ClinicalTrials.gov, Watched feeds (FDA, NIH/NIDCD, journals, EMA…).","url":"","detail":{"changesAssessment":"No."}}]}};

<script>
/* Tinnitus Atlas — app.js: data layer + shared chrome + page renderers.
   All pages render from /data/*.json. No frameworks, no build step. */
(function () {
  'use strict';

  /* ---------------- theme ---------------- */
  const THEME_KEY = 'ta:theme';
  function applyTheme(t) { document.documentElement.dataset.theme = t; }
  (function initTheme() {
    let t;
    try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'dark'; // dark is the default; light only by explicit choice
    applyTheme(t);
  })();

  /* ---------------- utils ---------------- */
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
  const fmtDate = iso => {
    if (!iso) return '';
    const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return isNaN(d) ? iso : d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  };
  /* Single-file preview mode: data embedded, pages routed via location.hash (see tools/build_preview.py) */
  const SINGLE = !!window.__TA_SINGLE__;
  const qs = k => new URLSearchParams(SINGLE ? (location.hash.split('?')[1] || '') : location.search).get(k);

  /* ---------------- data ---------------- */
  let DB = null;
  function indexDB() {
    DB.catById = Object.fromEntries(DB.categories.map(c => [c.id, c]));
    DB.tById = Object.fromEntries(DB.treatments.map(t => [t.id, t]));
    DB.sById = Object.fromEntries(DB.studies.map(s => [s.id, s]));
  }
  async function load() {
    if (DB) return DB;
    if (window.__TA_DATA__) { DB = window.__TA_DATA__; indexDB(); return DB; }
    // cache:'no-cache' revalidates instead of silently serving stale weekly data
    // (never use ?v= query-busting here — the Capacitor iOS asset server can't serve query URLs)
    const get = f => fetch('data/' + f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    const [meta, categories, treatments, studies, trials, institutions, rankings, weeklyIndex] =
      await Promise.all(['meta.json', 'categories.json', 'treatments.json', 'studies.json',
        'trials.json', 'institutions.json', 'rankings.json', 'weekly/index.json'].map(get));
    let weekly = null;
    if (weeklyIndex.reports && weeklyIndex.reports.length) {
      weekly = await get('weekly/' + weeklyIndex.reports[0].file);
    }
    DB = { meta, categories, treatments, studies, trials, institutions, rankings, weeklyIndex, weekly };
    indexDB();
    return DB;
  }

  /* ---------------- watchlist (v2: treatments + trials + institutions) ---------------- */
  const WL_KEY = 'ta:watchlist', SEEN_KEY = 'ta:lastSeen';
  function wlGet() {
    try {
      const raw = JSON.parse(localStorage.getItem(WL_KEY));
      if (Array.isArray(raw)) return { treatments: raw, trials: [], institutions: [] }; // v1 migration
      return Object.assign({ treatments: [], trials: [], institutions: [] }, raw || {});
    } catch (e) { return { treatments: [], trials: [], institutions: [] }; }
  }
  const wlSet = wl => { try { localStorage.setItem(WL_KEY, JSON.stringify(wl)); } catch (e) {} };
  const wlHas = (kind, id) => (wlGet()[kind] || []).includes(id);
  function wlToggle(kind, id) {
    const wl = wlGet(); const l = wl[kind] = wl[kind] || [];
    const i = l.indexOf(id); i >= 0 ? l.splice(i, 1) : l.push(id); wlSet(wl); return i < 0;
  }

  /* ---------------- My Tinnitus Profile (local-only) ---------------- */
  const PROFILE_KEY = 'ta:profile';
  const getProfile = () => { try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) { return null; } };
  const setProfile = p => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {} };
  const SUBTYPE_LABELS = {
    general: 'Broad / unspecified tinnitus', pulsatile: 'Pulsatile tinnitus',
    somatic: 'Somatic-modulated tinnitus', 'hearing-loss': 'With hearing loss',
    'sudden-hl': 'After sudden hearing loss', 'ci-candidate': 'Cochlear-implant candidates',
    meniere: "Meniere's disease"
  };
  const CHAR_NAMES = {
    pulsatile: 'pulsatile (heartbeat-synchronized) tinnitus',
    somatic: 'tinnitus that changes with jaw or neck movement',
    'hearing-loss': 'tinnitus with hearing loss',
    'sudden-hl': 'tinnitus after a sudden hearing drop'
  };
  function profileTags(p) {
    if (!p) return [];
    const tags = [];
    if (p.pulsatile === 'yes') tags.push('pulsatile');
    if (p.somaticModulation === 'yes' || p.jawTMJ === 'yes' || p.neck === 'yes') tags.push('somatic');
    if (p.hearingLoss === 'yes') tags.push('hearing-loss');
    if (p.suddenHL === 'yes') tags.push('sudden-hl');
    return tags; // specific tags only — 'general' matches are not meaningful
  }
  function profileMatches(t) {
    const p = getProfile(); if (!p) return [];
    const specific = profileTags(p);
    return (t.subtypeTags || []).filter(tag => specific.includes(tag));
  }
  // Red flags from AAO-HNSF CPG: Tinnitus (2014) + AAO-HNSF CPG: Sudden Hearing Loss (2019)
  function redFlags(p) {
    const f = [];
    if (p.pulsatile === 'yes') f.push('tinnitus that pulses with your heartbeat');
    if (p.suddenHL === 'yes') f.push('a sudden drop in hearing (guidelines recommend prompt evaluation for this one)');
    if (p.laterality === 'left' || p.laterality === 'right') f.push('tinnitus in one ear only');
    if (p.asymmetric === 'yes') f.push('hearing that is clearly different between ears, or recently changed');
    if (p.neuroSymptoms === 'yes') f.push('neurological symptoms alongside tinnitus');
    if (p.vertigo === 'yes') f.push('vertigo or serious dizziness');
    if (p.earPainDrainage === 'yes') f.push('ear pain or discharge');
    if (p.trauma === 'yes') f.push('a recent head or ear injury');
    return f;
  }

  /* ---------------- plain-language helpers ---------------- */
  const EVIDENCE_WORDS = { 1: 'Weak', 2: 'Limited', 3: 'Moderate', 4: 'Strong', 5: 'Very strong' };
  function effectWord(t) {
    const l = ['moderate', 'strong'].includes(t.loudness.level);
    const d = ['moderate', 'strong'].includes(t.distress.level);
    if (l && d) return 'Loudness + distress';
    if (l) return 'Loudness';
    if (d) return 'Distress';
    if (t.loudness.level === 'limited' || t.distress.level === 'limited') return 'Unclear (early signals)';
    return 'Unclear';
  }
  function availWord(t) {
    const a = t.availability || {};
    if (a.availableNow) return /some|limited|scarce|select/i.test(a.usa || '') ? 'Limited availability' : 'Available';
    if (/investigational|pre-clinical|registered/i.test((t.regulatory || {}).status || '')) return 'Clinical trials / research only';
    return 'Not yet available';
  }
  function whoStudied(t) {
    if (t.whoStudied) return t.whoStudied;
    const s = (t.subtypes || []).filter(Boolean);
    return s.length ? 'Studied primarily in people with ' + s.join('; ') : 'Studied in broad or unspecified tinnitus populations';
  }
  /* ---------- Evidence Profile visuals (no chart library; CSS marks only) ----------
     Mapping (documented in ARCHITECTURE.md + About): qualitative → 0–4 segments.
     strong=4 · moderate=3 · limited=2 · weak=1 · none=0 · missing field = "Not yet assessed"
     (hatched, NOT zero — unknown is not the same as weak). No invented percentages. */
  const SEG = { strong: 4, moderate: 3, limited: 2, weak: 1, none: 0 };
  /* Replication uses its own 5-category semantics (independent reproduction of POSITIVE findings).
     'conflicting' = replication was attempted and results disagree — rendered as its own state,
     never forced onto the positive 0–4 scale. Legacy values (strong/moderate/limited) map via SEG. */
  const REP_SEG = { 'strong-independent': 4, 'limited-independent': 2, 'same-group': 1, none: 0 };
  const REP_LABELS = {
    'strong-independent': 'Strong independent', 'limited-independent': 'Limited independent',
    'same-group': 'Same group/sponsor only', none: 'None yet', conflicting: 'Conflicting results'
  };
  const IND_LABELS = {
    'primarily-independent': 'Primarily independent', mixed: 'Mixed',
    'primarily-sponsor': 'Primarily sponsor-supported', unclear: 'Independence unclear'
  };
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function segbar(n, na, total, cf) {
    total = total || 4; // evidence quality uses 5 (one segment per score point); qualitative dims use 4
    let s = '';
    for (let i = 1; i <= total; i++) s += `<i class="${cf ? 'cf' : (!na && i <= n ? 'on' : '')}"></i>`;
    return `<span class="segbar${na ? ' na' : ''}${cf ? ' conflict' : ''}" aria-hidden="true">${s}</span>`;
  }
  function epDims(t) {
    const availW = availWord(t);
    const availSeg = { 'Available': 4, 'Limited availability': 3, 'Clinical trials / research only': 1, 'Not yet available': 0 }[availW] ?? 0;
    const lv = o => ({ segs: SEG[o.level] ?? 0, word: LV_LABELS[o.level] || cap(o.level), na: false });
    return [
      { label: 'Evidence quality', segs: t.evidenceScore, total: 5, word: `${EVIDENCE_WORDS[t.evidenceScore]} (${t.evidenceScore}/5)`, na: false,
        def: 'How strong and rigorous is the underlying clinical evidence? (5 segments — one per point of the 1–5 evidence score, so 4/5 and 5/5 look different.)' },
      { label: 'Replication', segs: REP_SEG[t.replication] ?? SEG[t.replication] ?? 0,
        word: t.replication ? (REP_LABELS[t.replication] || cap(t.replication)) : 'Not yet assessed',
        na: t.replication == null, cf: t.replication === 'conflicting',
        def: 'Have INDEPENDENT groups reproduced the positive findings? Repeats by the same lab or sponsor count as "Same group/sponsor only". "Conflicting results" means replication was attempted and independent results disagree — shown as its own state, not a strength level.' },
      { label: 'Loudness evidence', ...lv(t.loudness),
        def: 'Is there evidence the tinnitus sound itself became quieter?' },
      { label: 'Distress evidence', ...lv(t.distress),
        def: 'Is there evidence tinnitus became less bothersome or quality of life improved?' },
      { label: 'Safety', segs: SEG[t.safetyLevel] ?? 0, word: t.safetyLevel ? cap(t.safetyLevel) : 'Not yet assessed', na: t.safetyLevel == null,
        def: 'What does current evidence show about tolerability and known risks?' },
      { label: 'Availability', segs: availSeg, word: availW, na: false,
        def: 'Can patients realistically access this today?' }
    ];
  }
  function evidenceProfile(t) {
    const dims = epDims(t);
    const ind = t.independence ? `<div class="eprow"><span class="lab">Independence</span><span class="segbar" style="visibility:hidden" aria-hidden="true"></span>
        <span class="val">${esc(IND_LABELS[t.independence] || cap(t.independence))}</span></div>` : '';
    const notes = [t.replicationNote && 'Replication: ' + t.replicationNote, t.independenceNote && 'Independence: ' + t.independenceNote].filter(Boolean);
    return `<div class="eprofile"><div class="k">Evidence profile</div>
      ${dims.map(d => `<div class="eprow"><span class="lab">${esc(d.label)}</span>${segbar(d.segs, d.na, d.total, d.cf)}
        <span class="val">${esc(d.word)}</span></div>`).join('')}
      ${ind}
      ${notes.length ? `<p class="small muted" style="margin:6px 0 0">${notes.map(esc).join('<br>')}</p>` : ''}
      <details><summary>What does each bar mean?</summary>
        <ul class="small">${dims.map(d => `<li><strong>${esc(d.label)}:</strong> ${esc(d.def)}</li>`).join('')}
        <li class="muted">Evidence quality shows the 1–5 score directly (one segment per point). The other bars show
        qualitative categories from the reviewed database (Strong=4 segments · Moderate=3 · Limited=2 · Weak=1 · None=0).
        A hatched bar means "not yet assessed" — unknown is not the same as weak. An amber striped Replication bar means
        "Conflicting results" — independent studies disagree, which is different from both weak and none.
        <strong>Independence</strong> states who produced the evidence: primarily independent researchers, a mix, or
        primarily the treatment's own sponsor — it does not change the scores, but it tells you how much rests on
        parties with a commercial stake.
        No percentages are shown because tinnitus studies measure different outcomes; a single "effectiveness %"
        would be scientifically misleading.</li></ul>
      </details></div>`;
  }
  function countBars(rows, opts) { // rows: [{label, n, color?, href?}] — single-hue magnitude bars + always-on labels
    const max = Math.max(1, ...rows.map(r => r.n));
    return `<div class="dchart" role="img" aria-label="${esc(opts && opts.aria || 'Counts')}: ${rows.map(r => r.label + ' ' + r.n).join(', ')}">
      ${rows.map(r => {
        const inner = `<span class="lab">${esc(r.label)}</span>
          <span class="dbar"><i style="width:${(r.n / max * 100).toFixed(1)}%${r.color ? ';--d-c:' + r.color : ''}"></i></span>
          <span class="n">${r.n}</span>`;
        return r.href ? `<a class="drow" href="${esc(r.href)}">${inner}</a>` : `<div class="drow">${inner}</div>`;
      }).join('')}</div>`;
  }
  function timelineClass(ev) { // presentation-only keyword classification — never alters evidence data
    const s = ev.toLowerCase();
    if (/fail|miss|null|negative|discontinu|dissolv|terminat|no benefit|not achieved|silen|refut/.test(s)) return 'tl-negative';
    if (/fda|cleared|authoriz|de novo|ce mark|approval|designation|diga|regulat/.test(s)) return 'tl-regulatory';
    if (/launch|commercial|spinout|spin|startup|marketing/.test(s)) return 'tl-commercial';
    if (/rating|rank|tier|audit|assessment/.test(s)) return 'tl-assessment';
    return 'tl-study';
  }
  const TL_KEY = `<div class="tl-key">
    <span><i style="background:var(--c-promising)"></i>Study</span>
    <span><i style="background:var(--c-strong)"></i>Regulatory</span>
    <span><i style="background:var(--c-weak)"></i>Negative / setback</span>
    <span><i style="background:var(--c-emerging)"></i>Commercial</span>
    <span><i style="background:var(--c-watch)"></i>Our assessment</span></div>`;

  function regExplain(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('de novo')) return 'De Novo authorized = the FDA reviewed it as a brand-new device type and allowed marketing. Stronger than "cleared", weaker than full "approval".';
    if (s.includes('510(k)') || s.includes('cleared')) return 'FDA cleared (510(k)) = judged similar to an existing device. Clearance is NOT proof that it works.';
    if (s.includes('pma') || s.startsWith('fda approved')) return 'FDA approved = passed the FDA\'s strictest review (PMA) — for the indication on its label.';
    if (s.includes('off-label')) return 'Off-label = doctors may legally use an approved product for a purpose it wasn\'t originally approved for.' + (s.includes('investigational') ? ' A dedicated product for this use is still investigational (being tested).' : '');
    if (s.includes('investigational')) return 'Investigational = still being tested; not authorized for sale for this use.';
    if (s.includes('ce mark') || s.includes('ce-mark')) return 'CE marked = meets European safety requirements; for low-risk devices this is not proof of effectiveness.';
    if (s.includes('standard')) return 'An established therapy — no device/drug authorization applies.';
    if (s.includes('unregulated') || s.includes('supplement') || s.includes('wellness')) return 'No regulator has evaluated this for tinnitus at all.';
    if (s.includes('off-label')) return 'Off-label = the product is approved for something else; using it for tinnitus is at the prescriber\'s discretion.';
    return '';
  }

  /* ---------------- shared components ---------------- */
  const TIER_LABELS = {
    1: ['Strongest evidence', 'b-strong'], 2: ['Promising', 'b-promising'],
    3: ['Experimental', 'b-emerging'], 4: ['Helps you cope', 'b-watch'],
    5: ['Weak / unsupported', 'b-weak']
  };
  const LV_LABELS = { none: 'None shown', limited: 'Limited', moderate: 'Moderate', strong: 'Strong' };
  const scoreColor = n => n >= 4 ? 'var(--c-strong)' : n >= 3 ? 'var(--c-promising)' : n >= 2 ? 'var(--c-watch)' : 'var(--c-weak)';

  function tierBadge(tier) {
    const [label, cls] = TIER_LABELS[tier] || ['—', 'b-weak'];
    return `<span class="badge ${cls}">${label}</span>`;
  }
  function emeter(score, label) {
    let dots = '';
    for (let i = 1; i <= 5; i++) dots += `<i class="${i <= score ? 'on' : ''}"></i>`;
    return `<span class="emeter" style="--em-c:${scoreColor(score)}" title="Evidence score ${score}/5 (${EVIDENCE_WORDS[score]})"
      role="img" aria-label="Evidence score ${score} out of 5, ${EVIDENCE_WORDS[score]}">${dots}<span class="lab">${label !== false ? score + '/5 · ' + EVIDENCE_WORDS[score] : ''}</span></span>`;
  }
  function duo(t, compact) {
    const cell = (k, o) => `<div class="cell"><div class="k">${k}</div>
      <div class="v lv-${esc(o.level)}">${LV_LABELS[o.level] || esc(o.level)}</div>
      ${compact ? '' : `<div class="small muted">${esc(o.summary)}</div>`}</div>`;
    return `<div class="duo">${cell('🔉 Loudness', t.loudness)}${cell('🧠 Distress', t.distress)}</div>`;
  }
  function availBadge(t) {
    return t.availability && t.availability.availableNow
      ? '<span class="badge b-strong">Available now</span>'
      : '<span class="badge b-emerging">Not yet available</span>';
  }
  function updatedRecently(t, days) {
    const cutoff = Date.now() - (days || 45) * 864e5;
    return (t.latest || []).some(l => new Date(l.date) >= cutoff);
  }

  function treatmentCard(t, opts) {
    opts = opts || {};
    const cat = DB.catById[t.category] || {};
    return `<a class="card tcard" href="treatment.html?id=${esc(t.id)}" style="--cat-c:${esc(cat.color || '#888')}">
      ${opts.rank ? `<span class="rank">#${opts.rank}</span>` : ''}
      <span class="cat" style="color:${esc(cat.color || 'var(--muted)')}">${esc(cat.icon || '')} ${esc(cat.name || t.category)}</span>
      <h3>${updatedRecently(t) ? '<span class="updated-dot" title="Updated recently"></span>' : ''}${esc(t.name)}</h3>
      <p class="one">${esc(t.oneLiner)}</p>
      ${duo(t, true)}
      <p class="who">👥 ${esc(whoStudied(t))}</p>
      <div class="foot">${emeter(t.evidenceScore)} ${tierBadge(t.tier)}
        <span class="badge b-promising" title="What the evidence addresses">🎯 ${effectWord(t)}</span> ${availBadge(t)}
        ${t.narrowPopulation ? '<span class="badge b-watch" title="Results apply only to a specific diagnosed population">⚠ Specific population only</span>' : ''}</div>
    </a>`;
  }

  /* ---------------- chrome ---------------- */
  const NAV = [
    ['index.html', 'Home', '🏠'],
    ['treatments.html', 'Treatments', '🧭'],
    ['trials.html', 'Trials', '🧪'],
    ['research.html', 'Research', '📰'],
    ['watchlist.html', 'Watchlist', '⭐'],
  ];
  const NAV_MORE = [['search.html', 'Search'], ['profile.html', 'My Profile'], ['compare.html', 'Compare'], ['institutions.html', 'Institutions'], ['about.html', 'About']];

  function chrome() {
    $$('.topbar, .bottomnav, .footer').forEach(el => el.remove()); // idempotent (single-file router re-runs it)
    const brand = (DB && DB.meta && DB.meta.name) || 'Tinnitus Atlas';
    // keep the brand configurable: page titles follow data/meta.json
    if (DB && document.title.includes('Tinnitus Atlas')) {
      document.title = document.title.replace(/Tinnitus Atlas/g, brand);
    }
    const page = document.body.dataset.page || '';
    const here = f => f.replace('.html', '') === page ? ' aria-current="page"' : '';
    const top = document.createElement('header');
    top.className = 'topbar';
    top.innerHTML = `
      <a class="brand" href="index.html"><span class="mark" aria-hidden="true">◔</span><span>${esc(brand)}</span></a>
      <nav class="nav-desktop" aria-label="Main">
        ${NAV.concat(NAV_MORE.map(x => [x[0], x[1], ''])).map(([f, n]) => `<a href="${f}"${here(f)}>${n}</a>`).join('')}
      </nav>
      <button class="theme-btn" type="button" aria-label="Toggle dark mode">◐</button>`;
    document.body.prepend(top);
    $('.theme-btn', top).addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(t); try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    });

    const bottom = document.createElement('nav');
    bottom.className = 'bottomnav'; bottom.setAttribute('aria-label', 'Primary');
    bottom.innerHTML = NAV.map(([f, n, i]) =>
      `<a href="${f}"${here(f)}><span class="ico" aria-hidden="true">${i}</span>${n}</a>`).join('');
    document.body.append(bottom);

    const foot = document.createElement('footer');
    foot.className = 'footer';
    foot.innerHTML = `<div class="wrap">
      <p><strong>${esc(brand)}</strong> is an educational and scientific information resource. It does not diagnose
      tinnitus, does not provide personalized medical advice, and does not replace an ENT physician, audiologist, or
      other qualified professional. Treatment rankings reflect our evaluation of available evidence; scientific
      understanding changes and individual results differ. <a href="about.html#disclaimer">Full disclaimer & methodology</a>.</p>
      <p class="small" id="foot-meta"></p></div>`;
    document.body.append(foot);
  }

  /* ---------------- page renderers ---------------- */
  const PAGES = {};

  /* ----- home ----- */
  PAGES.index = function () {
    const { meta, treatments, rankings, weekly, categories, trials } = DB;
    $('#stat-treatments').textContent = treatments.length;
    $('#stat-studies').textContent = DB.studies.length;
    $('#stat-trials').textContent = trials.length;
    $('#stat-updated').textContent = fmtDate(meta.lastFullReview);

    // Top 10 (with "Why this ranking?" expanders)
    $('#top10').innerHTML =
      (rankings.uncertaintyNote ? `<div class="notice" style="grid-column:1/-1;margin:0 0 4px">ℹ️ <strong>How solid is this order?</strong> ${esc(rankings.uncertaintyNote)}</div>` : '') +
      rankings.top.map(r => {
        const t = DB.tById[r.id]; if (!t) return '';
        return rankedCard(t, r);
      }).join('');

    // Available now
    const avail = treatments.filter(t => t.availability && t.availability.availableNow && t.tier <= 4 && t.evidenceScore >= 3)
      .sort((a, b) => b.evidenceScore - a.evidenceScore).slice(0, 6);
    $('#available').innerHTML = avail.map(t => treatmentCard(t)).join('');

    // What's new this week
    if (weekly) {
      $('#week-date').textContent = fmtDate(weekly.date);
      $('#whatsnew').innerHTML = weekly.items.slice(0, 5).map(weekItem).join('') +
        `<p><a class="btn btn-ghost" href="research.html">Read the full weekly report →</a></p>`;
    }

    // Coming soon
    const coming = trials.filter(t => t.watch).slice(0, 4);
    $('#coming').innerHTML = coming.map(trialCard).join('');

    // Where the evidence stands (auto-computed distribution; semantic ordinal colors + always-on labels)
    const stand = $('#evstand');
    if (stand) {
      const g = s => treatments.filter(t => s(t.evidenceScore)).length;
      const loudN = treatments.filter(t => ['moderate', 'strong'].includes(t.loudness.level)).length;
      const distN = treatments.filter(t => ['moderate', 'strong'].includes(t.distress.level)).length;
      const bothN = treatments.filter(t => ['moderate', 'strong'].includes(t.loudness.level) && ['moderate', 'strong'].includes(t.distress.level)).length;
      stand.innerHTML = countBars([
        { label: 'Strong evidence (4–5/5)', n: g(s => s >= 4), color: 'var(--c-strong)' },
        { label: 'Moderate evidence (3/5)', n: g(s => s === 3), color: 'var(--c-promising)' },
        { label: 'Limited evidence (2/5)', n: g(s => s === 2), color: 'var(--c-watch)' },
        { label: 'Weak / unsupported (1/5)', n: g(s => s === 1), color: 'var(--c-weak)' }
      ], { aria: 'Treatments by evidence strength' }) +
      `<p class="small muted" style="margin:10px 0 0">Of ${treatments.length} tracked treatments,
        <a href="treatments.html?flag=loud">${loudN} have at least moderate evidence for the sound itself</a>,
        <a href="treatments.html?flag=distress">${distN} for being less bothered</a> — and only ${bothN} for both.
        Counts update automatically; the underlying classifications only change through the held-review process.</p>`;
    }

    // What hasn't worked (Tier 5, still marketed/available — the ones people spend money on)
    const neg = treatments.filter(t => t.tier === 5 && t.availability && t.availability.availableNow)
      .sort((a, b) => a.evidenceScore - b.evidenceScore).slice(0, 3);
    if ($('#negative')) $('#negative').innerHTML = neg.map(t => treatmentCard(t)).join('');

    // Categories
    $('#cats').innerHTML = categories.map(c => {
      const n = treatments.filter(t => t.category === c.id).length;
      return `<a class="catcard" href="treatments.html?cat=${esc(c.id)}" style="--cat-c:${esc(c.color)}">
        <span class="ico" aria-hidden="true">${esc(c.icon)}</span><h3>${esc(c.name)}</h3>
        <span class="small muted">${esc(c.blurb)}</span><span class="count">${n} treatment${n === 1 ? '' : 's'} tracked</span></a>`;
    }).join('');
  };

  function whyRankingBlock(r, t) {
    const d = r.detail || {};
    const row = (k, v) => v ? `<li><strong>${k}:</strong> ${esc(v)}</li>` : '';
    return `${r.whyPlain ? `<p class="whyline"><strong>Why #${r.rank}?</strong> ${esc(r.whyPlain)}</p>` : ''}
      <details class="rdetail"><summary>Research detail — the full reasoning</summary>
      <p class="small">${esc(r.why)}</p>
      <ul class="small">
        ${row('Strongest evidence', d.strongest)}
        ${row('Weakest point', d.weakest)}
        ${row('Key studies', d.studies)}
        ${row('Independent replication', d.replication)}
        ${row('Loudness evidence', d.loudness || (t && t.loudness.summary))}
        ${row('Distress evidence', d.distress || (t && t.distress.summary))}
        ${row('Availability', d.availability)}
        ${row('Main uncertainty', d.uncertainty)}
        ${row('Ranking stability', r.stabilityNote)}
        ${row('What could change this ranking', r.couldChange)}
      </ul></details>`;
  }

  function rankedCard(t, r) {
    const cat = DB.catById[t.category] || {};
    return `<div class="card tcard" style="--cat-c:${esc(cat.color || '#888')}">
      <span class="rank">#${r.rank}</span>
      <span class="cat" style="color:${esc(cat.color || 'var(--muted)')}">${esc(cat.icon || '')} ${esc(cat.name || t.category)}</span>
      ${r.stability ? `<span class="badge ${r.stability === 'weighting-sensitive' ? 'b-watch' : 'b-strong'}" style="margin-left:4px" title="${esc(r.stabilityNote || '')}">${r.stability === 'weighting-sensitive' ? 'Weighting-sensitive' : 'Stable rank'}</span>` : ''}
      <h3>${updatedRecently(t) ? '<span class="updated-dot" title="Updated recently"></span>' : ''}<a href="treatment.html?id=${esc(t.id)}" style="color:inherit">${esc(t.name)}</a></h3>
      <p class="one">${esc(t.oneLiner)}</p>
      ${duo(t, true)}
      <div class="foot">${emeter(t.evidenceScore)} ${tierBadge(t.tier)} ${availBadge(t)}</div>
      ${whyRankingBlock(r, t)}
    </div>`;
  }

  const IMP_STYLE = {
    'Potentially Important': 'b-strong', 'Interesting but Early': 'b-emerging',
    'Confirms Previous Evidence': 'b-promising', 'Negative Result': 'b-watch',
    'Does Not Change Current Evidence': 'b-weak'
  };
  function weekItem(it) {
    const KIND_COLORS = { study: 'var(--c-promising)', trial: 'var(--c-emerging)', regulatory: 'var(--c-strong)', ranking: 'var(--c-watch)', negative: 'var(--c-weak)', news: 'var(--c-promising)' };
    const d = it.detail || {};
    const drow = (k, v) => (v && v !== 'Not reported' && (!Array.isArray(v) || v.length)) ?
      `<li><strong>${k}:</strong> ${esc(Array.isArray(v) ? v.join('; ') : v)}</li>` : '';
    return `<div class="week-item" style="--w-c:${KIND_COLORS[it.kind] || 'var(--c-promising)'}">
      ${it.importance ? `<span class="badge ${IMP_STYLE[it.importance] || 'b-weak'}" style="margin-bottom:4px">${esc(it.importance)}</span>` : ''}
      ${it.safetySignal ? `<span class="badge b-watch" style="margin-bottom:4px">⚠ Possible safety signal — read the source</span>` : ''}
      ${it.underEvaluation ? `<span class="badge b-emerging" style="margin-bottom:4px">Impact on Tinnitus Evidence rating: Under evaluation</span>` : ''}
      <div class="t">${esc(it.title)}</div>
      ${it.whyMatters ? `<div class="small"><strong>Why it matters:</strong> ${esc(it.whyMatters)}</div>` : ''}
      <details class="rdetail"><summary>Research detail</summary>
        <p class="small">${esc(it.summary)}</p>
        <ul class="small">
          ${drow('Study type', d.studyType)}${drow('Population', d.population)}${drow('Sample size', d.sampleSize)}
          ${drow('Control / comparison', d.control)}${drow('Comparison type', d.comparisonType)}
          ${drow('Primary endpoint', d.primaryEndpoint)}${drow('Secondary endpoints', d.secondaryEndpoints)}
          ${drow('🔉 Loudness outcome', d.loudnessOutcome)}${drow('🧠 Distress outcome', d.distressOutcome)}
          ${drow('Other outcomes', d.otherOutcomes)}${drow('Safety (as reported)', d.safety)}
          ${drow('Limitations', d.limitations)}${drow('Funding / conflicts', d.funding)}
          ${drow('Identifier', d.identifier)}${drow('Changes our assessment?', d.changesAssessment)}
        </ul>
        <p class="small">
        ${it.treatment && DB.tById[it.treatment] ? `<a href="treatment.html?id=${esc(it.treatment)}">${esc(DB.tById[it.treatment].name)} — full evidence page →</a><br>` : ''}
        ${it.url ? `<a href="${esc(it.url)}" rel="noopener" target="_blank">Original source ↗</a>` : ''}</p>
      </details></div>`;
  }

  function trialCard(tr, opts) {
    opts = opts || {};
    const t = tr.treatment && DB.tById[tr.treatment];
    const st = /recruit/i.test(tr.status) && !/stale/i.test(tr.status) ? 'b-strong' : /active|enrolling|ongoing/i.test(tr.status) ? 'b-promising' : /complete/i.test(tr.status) ? 'b-weak' : 'b-watch';
    const matches = t ? profileMatches(t) : [];
    return `<div class="card">
      <div class="foot" style="margin:0 0 8px;display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge ${st}">${esc(tr.status)}</span>
        ${tr.phase ? `<span class="badge b-emerging">${esc(tr.phase)}</span>` : ''}
        ${tr.country ? `<span class="badge b-weak" title="Country of the lead sponsor/site">📍 ${esc(tr.country)}</span>` : ''}
        ${tr.watch ? '<span class="badge b-watch">One to watch</span>' : ''}</div>
      <h3 style="font-size:1rem">${esc(tr.title)}</h3>
      <p class="small muted">${esc(tr.sponsor)}${tr.n ? ` · aiming to enroll ${esc(tr.n)} people` : ''}${tr.completionEst ? ` · est. completion ${esc(tr.completionEst)}` : ''}</p>
      ${tr.whyItMatters ? `<p class="small">${esc(tr.whyItMatters)}</p>` : ''}
      ${opts.profileNotes && matches.length ? `<div class="match-note">👤 This study involves ${matches.map(m => esc(CHAR_NAMES[m] || m)).join(' and ')} — a characteristic in your Tinnitus Profile. Only the study's research team can determine whether anyone is eligible.</div>` : ''}
      <p class="small" style="margin-bottom:0">
        ${t ? `<a href="treatment.html?id=${esc(t.id)}">${esc(t.name)}</a> · ` : ''}
        <a href="${esc(tr.url || ('https://clinicaltrials.gov/study/' + tr.nctId))}" rel="noopener" target="_blank">${esc(tr.nctId)} ↗</a>
        ${opts.follow ? ` <button class="btn followbtn watch-btn" type="button" data-watch-trial="${esc(tr.nctId)}" aria-pressed="${wlHas('trials', tr.nctId)}">${wlHas('trials', tr.nctId) ? '⭐ Watching' : '☆ Watch this trial'}</button>` : ''}</p>
    </div>`;
  }

  /* ----- treatments browse ----- */
  PAGES.treatments = function () {
    const flagParam = qs('flag') || '';
    const state = { cat: qs('cat') || '', type: qs('type') || '', q: '',
      avail: flagParam === 'avail', loud: flagParam === 'loud', distress: flagParam === 'distress',
      negative: flagParam === 'negative', profile: flagParam === 'profile' };
    const catChips = $('#cat-chips'), listEl = $('#tlist');
    catChips.innerHTML = `<button class="chip" data-cat="">All categories</button>` +
      DB.categories.map(c => `<button class="chip" data-cat="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</button>`).join('');
    const typeChips = $('#type-chips');
    if (typeChips) {
      const used = new Set(); DB.treatments.forEach(t => (t.subtypeTags || []).forEach(x => used.add(x)));
      typeChips.innerHTML = `<button class="chip" data-type="">Any tinnitus type</button>` +
        Object.keys(SUBTYPE_LABELS).filter(k => k !== 'general' && used.has(k))
          .map(k => `<button class="chip" data-type="${k}">${esc(SUBTYPE_LABELS[k])}</button>`).join('');
    }
    const profChip = $('[data-flag="profile"]');
    if (profChip && !getProfile()) profChip.hidden = true;

    function render() {
      $$('#cat-chips .chip').forEach(ch => ch.setAttribute('aria-pressed', ch.dataset.cat === state.cat));
      $$('#type-chips .chip').forEach(ch => ch.setAttribute('aria-pressed', ch.dataset.type === state.type));
      $$('#flag-chips .chip').forEach(ch => ch.setAttribute('aria-pressed', !!state[ch.dataset.flag]));
      let list = DB.treatments.slice();
      if (state.cat) list = list.filter(t => t.category === state.cat);
      if (state.type) list = list.filter(t => (t.subtypeTags || []).includes(state.type));
      if (state.avail) list = list.filter(t => t.availability && t.availability.availableNow);
      if (state.loud) list = list.filter(t => ['limited', 'moderate', 'strong'].includes(t.loudness.level));
      if (state.distress) list = list.filter(t => ['moderate', 'strong'].includes(t.distress.level));
      if (state.negative) list = list.filter(t => t.tier === 5);
      if (state.profile) list = list.filter(t => profileMatches(t).length);
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter(t => (t.name + ' ' + t.oneLiner + ' ' + t.developer + ' ' + (t.researchers || []).join(' ') + ' ' + t.mechanism).toLowerCase().includes(q));
      }
      if (state.loud) list.sort((a, b) => lvRank(b.loudness.level) - lvRank(a.loudness.level) || b.evidenceScore - a.evidenceScore);
      else list.sort((a, b) => a.tier - b.tier || b.evidenceScore - a.evidenceScore || a.name.localeCompare(b.name));
      const note =
        state.loud ? `<div class="notice" style="margin-bottom:14px">🔉 <strong>Honest note:</strong> very few treatments have credible evidence of making the tinnitus sound itself quieter — and most of those apply only to specific tinnitus types. Sorted by strength of loudness evidence; check each card's population.</div>` :
        state.negative ? `<div class="notice" style="margin-bottom:14px">These treatments have failed trials, never beat placebo, or are marketed well beyond their evidence. No judgment if you've tried them — the marketing is persuasive. The evidence just isn't.</div>` :
        state.profile ? `<div class="match-note" style="margin-bottom:14px">👤 Showing research studied in people who share characteristics with your Tinnitus Profile. This is evidence navigation, not a recommendation.</div>` : '';
      listEl.innerHTML = note + (list.length ? list.map(t => treatmentCard(t)).join('') :
        '<div class="empty">Nothing matches those filters.</div>');
      $('#tcount').textContent = list.length;
    }
    const lvRank = l => ({ strong: 3, moderate: 2, limited: 1 }[l] || 0);
    catChips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state.cat = b.dataset.cat; render(); } });
    if (typeChips) typeChips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state.type = b.dataset.type; render(); } });
    $('#flag-chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state[b.dataset.flag] = !state[b.dataset.flag]; render(); } });
    $('#tsearch').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
    render();
  };

  /* ----- treatment detail ----- */
  PAGES.treatment = function () {
    const t = DB.tById[qs('id')];
    const root = $('#tdetail');
    if (!t) { root.innerHTML = '<div class="empty">Treatment not found. <a href="treatments.html">Browse all treatments</a></div>'; return; }
    document.title = t.name + ' — ' + ((DB.meta && DB.meta.name) || 'Tinnitus Atlas');
    const cat = DB.catById[t.category] || {};
    const rEntry = DB.rankings.top.find(r => r.id === t.id);
    const rank = (rEntry || {}).rank;
    // "Previously: #x · y/5" — compare the last two ranking-history snapshots (Part XXI / #12)
    let prevNote = '';
    const rh = DB.rankings.history || [];
    if (rh.length >= 2) {
      const prev = (rh[rh.length - 2].snapshot || []).find(s => s.id === t.id);
      const cur = (rh[rh.length - 1].snapshot || []).find(s => s.id === t.id);
      if (prev && cur && (prev.rank !== cur.rank || prev.evidenceScore !== cur.evidenceScore)) {
        const why = (t.history && t.history[0] && t.history[0].reason) || rh[rh.length - 1].note || '';
        prevNote = `<div class="notice" style="margin:10px 0"><strong>Assessment changed.</strong>
          Previously: #${prev.rank || '—'} · Evidence ${prev.evidenceScore}/5 &nbsp;→&nbsp; Now: #${cur.rank || '—'} · Evidence ${cur.evidenceScore}/5.
          ${esc(why)}</div>`;
      }
    }
    const av = t.availability || {};
    const conf = { low: ['b-watch', 'Low'], moderate: ['b-promising', 'Moderate'], high: ['b-strong', 'High'] }[t.confidence] || ['b-weak', '—'];

    root.innerHTML = `
      <p class="small" style="margin-top:14px"><a href="treatments.html">‹ All treatments</a></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="cat" style="color:${esc(cat.color)};font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em">${esc(cat.icon)} ${esc(cat.name)}</span>
        ${rank ? `<span class="badge b-promising">#${rank} most promising</span>` : ''}
      </div>
      <h1 style="margin:.2em 0 .3em">${esc(t.name)}</h1>
      <p class="muted" style="max-width:46em">${esc(t.oneLiner)}</p>
      ${t.narrowPopulation ? `<div class="narrow-note">🎯 <strong>Applies only to a specific diagnosed tinnitus population.</strong> ${esc(t.narrowNote || '')}</div>` : ''}
      ${t.underReevaluation ? `<div class="notice" style="margin:10px 0">🔎 <strong>Evidence rating under re-evaluation${t.underReevaluation.since ? ' since ' + fmtDate(t.underReevaluation.since) : ''}.</strong>
        ${esc(t.underReevaluation.reason || '')} The rating shown is the current published assessment; it changes only when the review completes.</div>` : ''}
      ${plainBlock(t)}
      ${evidenceProfile(t)}
      ${profileRelevance(t)}
      <p><button class="btn watch-btn" type="button" id="watch" aria-pressed="${wlHas('treatments', t.id)}">⭐ <span>${wlHas('treatments', t.id) ? 'On your watchlist' : 'Add to watchlist'}</span></button>
      <a class="btn" href="compare.html?ids=${esc(t.id)}">⚖ Compare</a></p>

      ${prevNote}
      ${rEntry ? whyRankingBlock(rEntry, t) : ''}
      ${rankHistory(t)}
      <div class="snapshot" style="margin:16px 0">
        <div class="cell"><div class="k">Evidence score</div><div class="v">${emeter(t.evidenceScore)}</div></div>
        <div class="cell"><div class="k">Tier</div><div class="v">${tierBadge(t.tier)}</div></div>
        <div class="cell"><div class="k">Available now</div><div class="v">${av.availableNow ? 'Yes' : 'No'}</div></div>
        <div class="cell"><div class="k">Regulatory status</div><div class="v">${esc(t.regulatory.status)}</div>
          ${regExplain(t.regulatory.status) ? `<div class="small muted" style="margin-top:3px">${esc(regExplain(t.regulatory.status))}</div>` : ''}</div>
        <div class="cell"><div class="k">Loudness effect</div><div class="v lv-${esc(t.loudness.level)}">${LV_LABELS[t.loudness.level]}</div></div>
        <div class="cell"><div class="k">Distress effect</div><div class="v lv-${esc(t.distress.level)}">${LV_LABELS[t.distress.level]}</div></div>
        <div class="cell"><div class="k">Cost (approx.)</div><div class="v">${esc(av.cost || 'Unknown')}</div></div>
        <div class="cell"><div class="k">Confidence</div><div class="v"><span class="badge ${conf[0]}">${conf[1]}</span></div></div>
        <div class="cell"><div class="k">Best suited for</div><div class="v small">${esc(t.bestSuitedFor || '—')}</div></div>
        <div class="cell"><div class="k">Developer</div><div class="v small">${esc(t.developer || '—')}</div></div>
        <div class="cell"><div class="k">Last reviewed</div><div class="v small">${fmtDate(t.lastReviewed)}</div></div>
        <div class="cell"><div class="k">Studies tracked</div><div class="v small">${(t.studies || []).length}</div></div>
      </div>

      <div class="prose">
        <h2>What it is</h2><p>${esc(t.whatItIs)}</p>

        ${row('Distress effect', t => `<span class="lv-${esc(t.distress.level)}" style="font-weight:600">${LV_LABELS[t.distress.level]}</span><div class="small muted">${esc(t.distress.summary)}</div>`)}
