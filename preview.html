<meta charset="utf-8">
<title>Tinnitus Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tinnitus Atlas — design system. Mobile-first, DARK by default, light via [data-theme=light]. */

:root{
  --bg:#0c1120; --surface:#141b30; --surface-2:#1b2340; --text:#e8ecf7; --muted:#98a2bb;
  --line:#242e4d; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --brand-1:#0ea5b7; --brand-2:#5458e8;
  --grad-brand:linear-gradient(135deg,#0ea5b7,#5458e8);
  --c-strong:#34d39b;  --c-strong-bg:#0e2b22;  --c-strong-line:#1c4a3a;
  --c-promising:#6ea1ff;--c-promising-bg:#14213e;--c-promising-line:#263a66;
  --c-emerging:#b48aff; --c-emerging-bg:#241b3e; --c-emerging-line:#3d2f63;
  --c-watch:#f0a944;   --c-watch-bg:#2e2210;   --c-watch-line:#4d3a1d;
  --c-weak:#8b96ad;    --c-weak-bg:#1b2236;    --c-weak-line:#2c3552;
  --r:16px; --r-sm:10px;
  --font-display:"Sora",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#eef2fa; --text:#151a2b; --muted:#5b6478;
  --line:#e3e8f4; --shadow:0 1px 2px rgba(21,26,43,.05),0 8px 24px -12px rgba(21,26,43,.12);
  --c-strong:#0f9d6c;  --c-strong-bg:#e2f6ee;  --c-strong-line:#b5e6d2;
  --c-promising:#2f6fe4;--c-promising-bg:#e7eefc;--c-promising-line:#c3d5f7;
  --c-emerging:#7c4fd8; --c-emerging-bg:#f0eafc; --c-emerging-line:#d9c9f5;
  --c-watch:#c77414;   --c-watch-bg:#fdf1df;   --c-watch-line:#f2d9ae;
  --c-weak:#68738a;    --c-weak-bg:#eceff5;    --c-weak-line:#d5dae6;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font-body);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
@media(min-width:900px){body{padding-bottom:0}}
img{max-width:100%}
a{color:var(--c-promising);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,5.5vw,2.6rem);font-weight:700}
h2{font-size:clamp(1.25rem,3.6vw,1.7rem);font-weight:700}
h3{font-size:1.08rem;font-weight:600}
p{margin:.4em 0 .9em}
[hidden]{display:none!important}
.small{font-size:.86rem}.muted{color:var(--muted)}
.skip-link{position:absolute;left:-999px}
.skip-link:focus{left:12px;top:12px;background:var(--surface);padding:8px 14px;border-radius:8px;z-index:99}

.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;color:var(--text);font-size:1.05rem;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.nav-desktop{display:none;gap:2px;margin-left:auto}
.nav-desktop a{padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:.93rem}
.nav-desktop a:hover{text-decoration:none;color:var(--text);background:var(--surface-2)}
.nav-desktop a[aria-current="page"]{color:var(--text);background:var(--surface-2)}
@media(min-width:900px){.nav-desktop{display:flex}}
.theme-btn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
@media(min-width:900px){.theme-btn{margin-left:6px}}

/* ---------- bottom nav (mobile) ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:4px 0;border-radius:10px}
.bottomnav a:hover{text-decoration:none}
.bottomnav a .ico{font-size:1.15rem;line-height:1}
.bottomnav a[aria-current="page"]{color:var(--c-promising);font-weight:600}
@media(min-width:900px){.bottomnav{display:none}}

/* ---------- hero ---------- */
.hero{padding:34px 0 10px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:130%;pointer-events:none;
  background:radial-gradient(50% 60% at 20% 20%,color-mix(in srgb,var(--brand-1) 16%,transparent),transparent 70%),
             radial-gradient(45% 55% at 85% 10%,color-mix(in srgb,var(--brand-2) 14%,transparent),transparent 70%);}
.hero>*{position:relative}
.hero .kicker{font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:1.05rem;color:var(--muted);max-width:46em}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--font-display);font-size:1.25rem}
.stat span{font-size:.78rem;color:var(--muted)}

/* ---------- sections ---------- */
.section{padding:26px 0 6px}
.section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head .more{margin-left:auto;font-size:.9rem;font-weight:600}
.section-sub{color:var(--muted);margin:-8px 0 14px;max-width:52em}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr}
.grid-3{grid-template-columns:1fr}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid-3{grid-template-columns:1fr 1fr 1fr}}

/* treatment card */
.tcard{display:flex;flex-direction:column;gap:10px;position:relative;color:var(--text)}
a.tcard:hover{text-decoration:none;border-color:color-mix(in srgb,var(--c-promising) 45%,var(--line));transform:translateY(-1px);transition:.15s}
.tcard .rank{position:absolute;top:-11px;left:14px;background:var(--grad-brand);color:#fff;font-family:var(--font-display);font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 11px;box-shadow:var(--shadow)}
.tcard h3{margin:2px 0 0}
.tcard .cat{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tcard .one{color:var(--muted);font-size:.92rem;margin:0}
.tcard .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid;white-space:nowrap}
.b-strong{color:var(--c-strong);background:var(--c-strong-bg);border-color:var(--c-strong-line)}
.b-promising{color:var(--c-promising);background:var(--c-promising-bg);border-color:var(--c-promising-line)}
.b-emerging{color:var(--c-emerging);background:var(--c-emerging-bg);border-color:var(--c-emerging-line)}
.b-watch{color:var(--c-watch);background:var(--c-watch-bg);border-color:var(--c-watch-line)}
.b-weak{color:var(--c-weak);background:var(--c-weak-bg);border-color:var(--c-weak-line)}

/* evidence meter (5 dots) */
.emeter{display:inline-flex;align-items:center;gap:3px}
.emeter i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.emeter i.on{background:var(--em-c,var(--c-promising))}
.emeter .lab{font-size:.74rem;font-weight:600;color:var(--muted);margin-left:5px}

/* loudness / distress duo */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .cell{border-radius:var(--r-sm);padding:8px 10px;border:1px solid var(--line);background:var(--surface-2)}
.duo .cell .k{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.duo .cell .v{font-weight:600;font-size:.88rem}
.lv-none{color:var(--c-weak)}.lv-limited{color:var(--c-watch)}.lv-moderate{color:var(--c-promising)}.lv-strong{color:var(--c-strong)}

/* category cards */
.catcard{display:flex;flex-direction:column;gap:6px;border-radius:var(--r);padding:16px;border:1px solid var(--line);color:var(--text);background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.catcard:hover{text-decoration:none;transform:translateY(-1px);transition:.15s}
.catcard .ico{font-size:1.5rem}
.catcard .count{font-size:.78rem;color:var(--muted)}
.catcard::after{content:"";position:absolute;inset:auto -30px -34px auto;width:96px;height:96px;border-radius:50%;background:var(--cat-c,var(--c-promising));opacity:.10}

/* ---------- chips / filters ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--grad-brand);border-color:transparent;color:#fff;font-weight:600}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow)}
.searchbar input{flex:1;border:0;background:none;color:var(--text);font:inherit;outline:none;min-width:0}

/* ---------- snapshot (treatment page) ---------- */
.snapshot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(min-width:720px){.snapshot{grid-template-columns:repeat(4,1fr)}}
.snapshot .cell{background:var(--surface);padding:11px 13px}
.snapshot .k{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.snapshot .v{font-weight:600;font-size:.92rem;margin-top:2px}

/* prose sections */
.prose{max-width:760px}
.prose h2{margin-top:1.6em}
details.rdetail{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:0 14px;margin:10px 0}
details.rdetail summary{cursor:pointer;font-weight:600;padding:11px 0;color:var(--c-promising)}
details.rdetail[open]{padding-bottom:10px}

/* study table -> cards on mobile */
.study{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin:10px 0;background:var(--surface)}
.study .t{font-weight:600}
.study .meta{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.study .res{font-size:.92rem}
.study .flags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}

/* timeline */
.timeline{list-style:none;margin:10px 0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 18px}
.timeline li::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--grad-brand)}
.timeline b{font-family:var(--font-display)}

/* ---------- compare ---------- */
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:collapse;min-width:640px;width:100%}
table.cmp th,table.cmp td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:.9rem}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:130px;box-shadow:1px 0 0 var(--line)}
table.cmp thead th{font-family:var(--font-display)}

/* ---------- Phase 3: entry paths, plain-why, profile, search ---------- */
.paths{display:grid;gap:12px;grid-template-columns:1fr;margin:18px 0 6px}
@media(min-width:720px){.paths{grid-template-columns:1fr 1fr 1fr}}
.path-card{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  border-left:4px solid var(--p-c,var(--c-promising))}
.path-card:hover{text-decoration:none;transform:translateY(-1px);transition:.15s}
.path-card b{font-family:var(--font-display);font-size:1.05rem}
.path-card .small{color:var(--muted)}
.whyline{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 11px;margin:2px 0 0;font-size:.88rem}
.whyline strong{color:var(--c-promising)}
.who{margin:0;font-size:.8rem;color:var(--muted)}
.lvl-chip{cursor:pointer}
.imp{display:inline-flex;font-size:.72rem;font-weight:700;letter-spacing:.02em;border-radius:6px;padding:2px 8px;margin-right:6px}
.plain-block{border:1px solid var(--line);border-left:4px solid var(--c-promising);background:var(--surface);
  border-radius:var(--r-sm);padding:12px 16px;margin:14px 0;box-shadow:var(--shadow)}
.plain-block .k{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.narrow-note{border:1px solid var(--c-watch-line);background:var(--c-watch-bg);border-radius:var(--r-sm);
  padding:10px 14px;margin:10px 0;font-size:.9rem}
.fmqs-box{border:1px dashed var(--c-promising-line);background:var(--c-promising-bg);border-radius:var(--r-sm);
  padding:12px 15px;margin:14px 0}
.fmqs-box .small{margin:6px 0 0}
.pform fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 14px;background:var(--surface)}
.pform legend{font-family:var(--font-display);font-weight:600;padding:0 8px}
.pform label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:.93rem}
.pform select,.pform input[type=text]{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}
.pform .row{display:flex;flex-wrap:wrap;gap:10px 22px}
.redflag{border:1px solid var(--c-watch-line);background:var(--c-watch-bg);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.match-note{border:1px solid var(--c-promising-line);background:var(--c-promising-bg);border-radius:var(--r-sm);
  padding:9px 12px;margin:8px 0;font-size:.85rem}
.sr-row{display:flex;gap:10px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.sr-row .type{flex:none;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);min-width:78px;text-align:center}
.followbtn{font-size:.8rem;padding:5px 12px}

/* ---------- Phase 4: evidence visuals (no chart library — CSS marks) ---------- */
.eprofile{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
.eprofile .k{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.eprow{display:grid;grid-template-columns:minmax(96px,132px) 1fr minmax(74px,auto);gap:10px;align-items:center;padding:5px 0}
.eprow .lab{font-size:.83rem;color:var(--text)}
.eprow .val{font-size:.8rem;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap}
.segbar{display:flex;gap:2px;height:10px;max-width:300px}
.segbar i{flex:1;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.segbar i.on{background:var(--seg-c,var(--c-promising));border-color:transparent}
.segbar.na i{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--line) 3px,var(--line) 5px)}
/* Conflicting replication: its own state (amber stripes), never a level on the positive scale */
.segbar.conflict i.cf{background:repeating-linear-gradient(135deg,var(--c-watch),var(--c-watch) 3px,var(--surface-2) 3px,var(--surface-2) 6px);border-color:var(--c-watch);opacity:.85}
.eprofile details{margin-top:8px}
.eprofile summary{cursor:pointer;font-size:.82rem;color:var(--c-promising);font-weight:600}

/* homepage distribution + generic count bars */
.dchart{display:grid;gap:8px;margin:10px 0}
.drow{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center}
.drow .lab{font-size:.86rem}
.drow .n{font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.dbar{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:4px;background:var(--d-c,var(--c-promising));min-width:3px}
a.drow{color:var(--text)} a.drow:hover{text-decoration:none;background:var(--surface-2);border-radius:8px}

/* timeline event types (presentation-only classification) */
.timeline li::before{background:var(--tl-c,var(--grad-brand))}
.tl-regulatory{--tl-c:var(--c-strong)} .tl-negative{--tl-c:var(--c-weak)}
.tl-study{--tl-c:var(--c-promising)} .tl-commercial{--tl-c:var(--c-emerging)} .tl-assessment{--tl-c:var(--c-watch)}
.tl-key{display:flex;flex-wrap:wrap;gap:10px;font-size:.74rem;color:var(--muted);margin:4px 0 8px}
.tl-key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* ranking history strip */
.rankhist{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.rankhist .step{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.83rem;font-variant-numeric:tabular-nums}
.rankhist .arrow{color:var(--muted)}

/* ---------- misc ---------- */
.notice{border:1px solid var(--c-watch-line);background:var(--c-watch-bg);color:var(--text);border-radius:var(--r-sm);padding:11px 14px;font-size:.88rem}
.footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 0 30px;color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.92rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn:hover{text-decoration:none}
.btn-primary{background:var(--grad-brand);color:#fff;border-color:transparent}
.btn-ghost{background:none;border-color:transparent;color:var(--c-promising)}
.watch-btn[aria-pressed="true"]{background:var(--c-promising-bg);border-color:var(--c-promising-line);color:var(--c-promising)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.updated-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-strong);margin-right:6px}
.tag{font-size:.72rem;border-radius:6px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.week-item{border-left:3px solid var(--w-c,var(--c-promising));padding:2px 0 2px 12px;margin:12px 0}
.week-item .t{font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<div id="app"></div>
<template id="page-index"><main id="content" class="wrap">

  <section class="hero">
    <span class="kicker">Tinnitus Evidence · updated weekly from verified research sources</span>
    <h1>What does the science actually show?</h1>
    <p class="lead">Every credible tinnitus treatment — ranked by real evidence, in plain English,
    with the full research one tap deeper. Independent, free, and honest about what we don't know.</p>

    <div class="paths">
      <a class="path-card" href="treatments.html?flag=avail" style="--p-c:var(--c-strong)">
        <b>✅ What can I try today?</b>
        <span class="small">Treatments you can actually access now, with clear evidence labels.</span>
      </a>
      <a class="path-card" href="treatments.html?flag=loud" style="--p-c:var(--c-emerging)">
        <b>🔉 What may reduce the loudness?</b>
        <span class="small">The short list of approaches studied for making the sound itself quieter.</span>
      </a>
      <a class="path-card" href="trials.html" style="--p-c:var(--c-promising)">
        <b>🔭 What's coming next?</b>
        <span class="small">The clinical trials and pipeline treatments that could change the answer.</span>
      </a>
    </div>

</main></template><template id="page-about"><main id="content" class="wrap prose">
  <section class="hero" style="padding-bottom:0">
    <h1>About Tinnitus Evidence</h1>
    <p class="lead">A continuously updated map of the tinnitus treatment landscape. Not a blog, not a store,
    not affiliated with any treatment — an attempt to answer one question honestly:
    <em>what does the best current evidence actually tell us about tinnitus treatment, and what is changing?</em></p>
    <p class="small muted" id="about-meta"></p>
  </section>

  <h2>The one distinction that matters most</h2>
  <p><strong>🔉 Loudness</strong> means the tinnitus percept itself became quieter or less present —
  measured with psychoacoustic loudness matching or loudness ratings.
  <strong>🧠 Distress</strong> means the person's reaction improved — lower THI or TFI questionnaire scores,
  better sleep, less anxiety, better quality of life — while the sound may be unchanged.
  Most treatments with good evidence improve distress, not loudness. We show both, separately, everywhere,
  and never present a distress improvement as if the sound got quieter.</p>

  <h2 id="methodology">How we research the evidence</h2>
  <p>We screen hundreds of research results from sources including PubMed, ClinicalTrials.gov, Cochrane
  reviews, FDA records and major clinical guidelines. Around 170 unique studies, trials, guidelines and
  regulatory records were individually examined in building Tinnitus Evidence, with the most relevant
  research reviewed in greater detail. The current database includes 67 research records (plus separately
  tracked clinical-trial registry records and regulatory records), each checked against its primary source.</p>
  <p>For every included record we consider study quality, results, negative findings, replication, safety and
  potential conflicts of interest — and we separately evaluate whether an intervention actually reduced
  tinnitus loudness or primarily helped reduce distress and its impact on daily life. New research is
  monitored weekly, and corrections and retractions of cited research are checked on an ongoing schedule.
  Important new findings do not automatically change evidence ratings or rankings without additional
  verification. Tinnitus Evidence is designed to help people understand the research, including its
  limitations and uncertainties — it is an educational evidence-navigation resource, not medical advice.</p>

  <h2 id="limitations">Research limitations</h2>
  <p>In the interest of scientific transparency: our research process does not systematically search every
  scientific database or every non-English publication. Databases and sources we do not currently search
  directly include EMBASE, Scopus, Web of Science, PsycINFO and CINAHL; some international trial registries
  (such as ChiCTR) that lack public interfaces; non-English literature (reached mainly through
  English-language systematic reviews); and conference abstracts or preprints as a systematic source.
  Important research from these channels usually reaches the sources we do monitor — for example through
  PubMed indexing at publication — but sometimes later than specialists would see it. Ongoing weekly
  monitoring, periodic independent audits, retraction/correction checks and evidence updates are used to
  reduce these limitations over time, and our audit records are public.</p>

  <h2 id="heterogeneity">Tinnitus is not one condition</h2>
  <p>Roughly 14% of adults report some tinnitus and about 2% report severe tinnitus (global meta-analysis:
  Jarach 2022, JAMA Neurology) — but "tinnitus" covers very different situations that can require very
  different evaluation. <strong>Pulsatile</strong> tinnitus (rhythmic, heartbeat-synchronized) can have
  physical vascular causes that need imaging to identify — some treatable, a few dangerous.
  <strong>Somatosensory</strong> tinnitus (modulated by jaw or neck movement) has formal diagnostic criteria
  (Michiels 2018) and its own evidence base. Tinnitus with <strong>sudden hearing loss</strong> is
  time-sensitive. That heterogeneity is why this site tags treatments by studied population, shows
  narrow-population warnings, and why the My Tinnitus Profile red-flag check points characteristics like
  pulsatile tinnitus, sudden hearing loss, one-sided tinnitus or neurological symptoms toward professional
  evaluation. The site cannot determine which subtype anyone has — only a clinical evaluation can.</p>

  <h2 id="severe-distress">Severe distress and crisis support</h2>
  <div class="notice" style="border-color:var(--c-watch-line);background:var(--c-watch-bg)">
    <p style="margin-top:0">Tinnitus distress is real and measurable, and for some people it becomes severe.
    Population research (Lugo 2019, JAMA Otolaryngology) found severe tinnitus associated with higher rates of
    reported suicide attempts — an association, not proof that tinnitus itself causes suicidality, and
    depression and anxiety are major factors — but it is a documented reason to take severe distress
    seriously.</p>
    <p style="margin-bottom:0"><strong>If tinnitus-related distress ever includes thoughts of self-harm, seek
    urgent professional help now</strong> — in the US, call or text <strong>988</strong> (Suicide &amp; Crisis
    Lifeline); elsewhere, use your local emergency or crisis line. For persistent severe distress short of
    crisis, consider discussing it with a doctor or mental-health professional promptly — the best-evidenced
    tinnitus treatments on this site (CBT and related approaches) target exactly this burden, and comorbid
    depression, anxiety and insomnia are treatable in their own right.</p>
  </div>

  <h2 id="measures">The measures behind the numbers</h2>
  <p>Results on this site frequently cite standard questionnaires, and it matters what they do and do not
  measure. The <strong>Tinnitus Functional Index (TFI</strong>; Meikle 2012, Ear &amp; Hearing) scores
  tinnitus impact 0–100; a drop of about 13 points is the commonly used threshold for meaningful improvement.
  The <strong>Tinnitus Handicap Inventory (THI</strong>; Newman 1996) and the Tinnitus Questionnaire (TQ) are
  older impact/handicap measures with their own thresholds. All of these measure <em>how much tinnitus
  affects a person</em> — none of them measures how loud the tinnitus is, which is why a THI/TFI improvement
  is never presented here as evidence the sound got quieter. Loudness requires its own measures
  (psychoacoustic loudness matching, loudness ratings). The international <strong>COMiT'ID</strong> consensus
  (Hall 2018) formalized that different intervention types should measure different core outcome domains —
  the methodological basis for our refusal to reduce treatments to a single universal "effectiveness score."</p>

  <h2>Evidence tiers</h2>
  <ul>
    <li><strong style="color:var(--c-strong)">Tier 1 — Strongest current evidence.</strong> Quality trials, meaningful benefit, reproducibility, safety, independent research, availability.</li>
    <li><strong style="color:var(--c-promising)">Tier 2 — Promising.</strong> Meaningful human results with limitations: small trials, limited replication, manufacturer funding, short follow-up.</li>
    <li><strong style="color:var(--c-emerging)">Tier 3 — Experimental / emerging.</strong> Interesting mechanism or early evidence, insufficient proof.</li>
    <li><strong style="color:var(--c-watch)">Tier 4 — Symptom management / coping.</strong> Improves distress, sleep or quality of life with limited evidence of loudness change.</li>
    <li><strong style="color:var(--c-weak)">Tier 5 — Weak or unsupported.</strong> Poor-quality or contradictory evidence, failed trials, or heavy marketing with weak science.</li>
  </ul>

  <h2 id="rankings">How rankings work</h2>
  <p>The Top 10 weighs ten dimensions together: <strong>evidence quality</strong> (design, blinding, controls),
  <strong>size of benefit</strong>, <strong>loudness effect</strong> and <strong>distress effect</strong> (always
  scored separately), <strong>replication</strong>, <strong>study quality</strong>, <strong>safety</strong>,
  <strong>availability</strong>, <strong>regulatory status</strong>, and <strong>independent confirmation</strong>
  (non-manufacturer evidence). Novelty and media attention are explicitly excluded — during our Phase 2 audit an
  adversarial review demoted one treatment and removed another from the list for exactly that bias, and those
  changes are logged publicly in each treatment's change history. Every ranked card carries a plain-English
  "Why #N?" line plus an expandable research-detail breakdown. Rankings also carry explicit
  <strong>uncertainty information</strong>: we stress-tested the order under six reasonable weighting schemes,
  and each card is labeled "Stable rank" or "Weighting-sensitive" with the detail of how far it can move —
  because a ranking is a judgment about evidence, not a measurement, and it is never a treatment
  recommendation.</p>

  <h2 id="profile-bars">How the Evidence Profile bars work</h2>
  <p>Every treatment page carries an Evidence Profile: <strong>evidence quality</strong> (from the 1–5
  evidence score), <strong>replication</strong>, <strong>loudness evidence</strong> and <strong>distress
  evidence</strong> (the structured none/limited/moderate/strong ratings), <strong>safety</strong> (a reviewed
  tolerability rating), <strong>availability</strong> (derived from regulatory status and access), and
  <strong>independence</strong> — who produced the evidence: primarily independent researchers, a mix, or
  primarily the treatment's own sponsor. <strong>Replication</strong> uses five honest categories: none yet ·
  same group/sponsor only (repeats by the same lab or manufacturer are not independent replication) · limited
  independent · strong independent · and <em>conflicting results</em>, shown as its own amber-striped state
  when independent attempts disagree — disagreement is different from both "weak" and "none," and is never
  forced onto the positive scale. The evidence-quality bar has five
  segments — one per point of the 1–5 score, so 4/5 and 5/5 are visually distinct. The other bars show qualitative
  categories — Strong fills 4 segments, Moderate 3, Limited 2, Weak 1, None 0 — and a hatched bar means
  <em>not yet assessed</em>, because unknown is not the same as weak. We deliberately show
  <strong>no percentages and no single "effectiveness score"</strong>: tinnitus studies measure different
  outcomes in different populations, and one universal number would be scientifically misleading. Changes to
  these values go through the same held-for-review process as rankings — they never change automatically.</p>

  <h2>Evidence score (1–5)</h2>
  <p>Scored from study quality, size, randomization, blinding, sham/placebo control, independent replication,
  clinical significance, follow-up length, safety, conflicts of interest and regulatory evidence.
  The reasoning behind every score is stored and shown on the treatment page, and score changes are
  logged in each treatment's change history with the reason.</p>

  <h2>Source hierarchy</h2>
  <p>When the same development appears in many places we rank credibility roughly as: regulatory record /
  original trial → peer-reviewed original research → systematic review / meta-analysis → university or hospital
  publication → trial registry → professional medical organization → reputable medical journalism → company
  press release → general media → blogs and testimonials. A lower source never overrides stronger primary evidence,
  and marketing claims are always kept separate from research evidence.</p>

  <h2>Skepticism, both ways</h2>
  <p>We actively flag: marketing beyond the published evidence, manufacturer-sponsored studies, missing sham
  controls, self-report-only results, small samples, short follow-up, subgroup-only effects, high dropout,
  and press releases stronger than the papers behind them. We also avoid dismissing a treatment merely because
  it is new. Failed and negative trials are shown prominently — they are information, not embarrassments.</p>

  <h2 id="automation">How updates happen — and where automation is used</h2>
  <p>Tinnitus Evidence is kept current by an automated pipeline that runs <strong>once a week</strong>. Being
  straight about what that means:</p>
  <ul>
    <li><strong>Automated systems</strong> monitor trusted research sources (PubMed, ClinicalTrials.gov, FDA,
    NIH/NIDCD, Cochrane ENT, major journals, EMA and others), identify relevant new material, extract structured
    study information (design, sample size, endpoints, outcomes, funding), compare findings against our existing
    evidence record, and classify weekly updates. Every item links to its original source.</li>
    <li><strong>Routine research updates</strong> — a new study report, a trial status change verified at the
    registry, a follow-up publication — publish to "This Week in Tinnitus Research" automatically, after
    automated verification of the source, identifiers, dates, and duplicate checks. These items report what
    happened; they do not change our conclusions.</li>
    <li><strong>Anything that could change a conclusion is never automatic.</strong> A possible evidence-score,
    tier, ranking, loudness/distress-rating, safety or regulatory-status change is placed in a held queue with
    a full proposed-change report. The existing public assessment stands unchanged until that hold is resolved —
    one new paper is never allowed to silently rewrite a medical conclusion. Where a held item's underlying fact
    is verified, it may appear in the weekly feed marked <em>"Impact on Tinnitus Evidence rating: Under
    evaluation."</em></li>
    <li><strong>Company announcements</strong> are monitored for pipeline intelligence but always labeled
    "Company-reported development" and never treated as independent evidence. Regulatory statuses update only
    against authoritative records (FDA databases, ClinicalTrials.gov, EMA), never from press coverage.</li>
    <li><strong>Missing information is never inferred</strong> — items say "Not reported" or "Unable to verify."
    If a week's scan finds nothing meaningful, the feed says exactly that rather than manufacturing news.</li>
    <li><strong>Retractions and corrections are monitored monthly:</strong> every research paper cited on this
    site is re-checked against PubMed and Crossref for retraction, expression-of-concern and erratum notices.
    A detected notice is flagged visibly on the affected study record and routed to held review — cited
    research is never silently left standing after its source is withdrawn.</li>
  </ul>
  <p>Automated analysis is a monitoring and triage tool — it does not replace medical judgment, and this site
  does not claim physician or clinician editorial review of weekly items. A complete audit trail (source,
  identifier, extraction, classification, and publish/hold decision) is kept for every automated update.</p>

  <h2 id="disclaimer">Medical disclaimer</h2>
  <div class="notice" style="border-color:var(--line);background:var(--surface-2)">
    <p style="margin-top:0">Tinnitus Evidence is an educational and scientific information resource. It:</p>
    <ul>
      <li>does <strong>not</strong> diagnose tinnitus or any medical condition;</li>
      <li>does <strong>not</strong> provide personalized medical advice;</li>
      <li>does <strong>not</strong> replace an ENT physician, audiologist, or other qualified professional —
          if you have tinnitus, especially new, pulsatile or one-sided tinnitus, see a clinician;</li>
      <li>ranks treatments as an <strong>evaluation of available evidence</strong>, which can change as science evolves;</li>
      <li>cannot predict individual results — tinnitus subtypes differ and individual responses differ.</li>
    </ul>
    <p style="margin-bottom:0">Never start, stop or change a treatment based on this site without professional advice.</p>
  </div>

  <h2>Transparency</h2>
  <p>Every treatment page shows: last reviewed date, evidence-included-through date, number of studies,
  evidence score with reasoning, a confidence level, and its full change history. Facts we could not verify
  against a primary source are marked low-confidence rather than guessed.</p>

ew 5-category independent-replication semantics); independence: 'mixed' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Study records added: mindear-2024, guideline-nice-ng155.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."}],"scoreRationale":"Multiple independent RCT wins and a first sham-controlled success earn 3/5; the category is heterogeneous — the score applies to the tested products, not to app stores at large.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["general"],"replication":"limited-independent","safetyLevel":"strong","replicationNote":"Positive results across several independent products/groups (Kalmeda, Kyorin, Oto, iCBT), each product mostly single-trial.","independence":"mixed","independenceNote":"Some trials manufacturer-involved (Kalmeda, Kyorin, Oto co-funding); iCBT research largely independent."},{"id":"cochlear-implants","name":"Cochlear implants (for qualifying hearing loss)","category":"hearing-tech","tier":2,"evidenceScore":3,"oneLiner":"For people with severe hearing loss, implantation often genuinely reduces the tinnitus sound itself — one of the few things that does. It is never done for tinnitus alone.","whatItIs":"A surgically implanted electrode array that bypasses damaged hair cells and stimulates the auditory nerve directly. Tinnitus reduction is a frequent side benefit of implantation for severe-to-profound hearing loss.","howItWorks":"Restoring afferent auditory input reverses the deprivation-driven central gain and reorganization thought to generate tinnitus — the brain gets real signal again and turns the phantom down.","mechanism":"Restored auditory input reducing central gain","loudness":{"level":"moderate","summary":"Percept-level ranges (Ramakers 2015, Laryngoscope): tinnitus decreases in 25–72% of implanted patients and is completely suppressed in 8–45% — while 0–25% experience worsening and ~9% develop new-onset tinnitus. The 2024 meta-analysis adds a pooled tinnitus VAS −3.1 (a mixed scale covering annoyance/loudness/awareness, not pure loudness)."},"distress":{"level":"moderate","summary":"Pooled within-group THI −14.0 and TQ −15.9 across 28 mostly non-randomized cohort studies (853 patients)."},"regulatory":{"status":"FDA approved (for hearing loss)","detail":"Cochlear implants are FDA-approved for qualifying hearing loss — not specifically for tinnitus. Tinnitus benefit is an evidence-supported secondary effect.","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11431415/"},"availability":{"usa":"Available at implant centers for qualifying candidates; widely insurance-covered for hearing loss","europe":"Available","other":"Available in most developed health systems","prescription":true,"cost":"$30,000–100,000+ (typically covered by insurance for hearing-loss candidacy)","availableNow":true},"developer":"Cochlear, MED-EL, Advanced Bionics","researchers":["Robert Stokroos","Adriana Smit"],"subtypes":["severe-to-profound hearing loss with tinnitus","single-sided deafness"],"safety":"Surgical risks; 0–25% experience tinnitus worsening and ~9.2% develop new-onset tinnitus after implantation (Assouly, cited in the 2024 meta-analysis).","bestSuitedFor":"People who already qualify for a cochlear implant on hearing grounds","bestResult":"Complete tinnitus suppression in 8–45% of implanted patients across studies","limitations":["Only for implant candidates — not a general tinnitus treatment","Observational evidence; no one is implanted for tinnitus alone","Effects can wane over time; small risk of worsening"],"conflicts":"","studies":["ci-meta-2024"],"timeline":[{"year":1985,"event":"FDA approves the first cochlear implant; tinnitus suppression noted early."},{"year":2021,"event":"UMC Utrecht begins an RCT of implantation for tinnitus in single-sided deafness."},{"year":2024,"event":"Meta-analysis (28 studies, N=853): THI −14.0, loudness VAS −3.1."}],"latest":[{"date":"2026-09-03","text":"Trial status change: NCT06641999 is now 'Recruiting'","url":"https://clinicaltrials.gov/study/NCT06641999"},{"date":"2024-09-13","text":"2024 meta-analysis confirms percept-level and distress improvements after implantation.","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11431415/"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 2, evidence score 3/5","reason":"Consistent observational percept-level benefit in a restricted population; no RCT evidence for tinnitus as an indication."},{"date":"2026-09-04","change":"replication: 'strong' → 'strong-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"Large consistent observational literature with genuine loudness effects earns 3/5; capped because the data are non-randomized and apply only to implant candidates.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["hearing-loss","ci-candidate"],"narrowPopulation":true,"narrowNote":"Applies ONLY to people who qualify for a cochlear implant because of severe-to-profound hearing loss. Nobody is implanted for tinnitus alone.","replication":"strong-independent","safetyLevel":"moderate","replicationNote":"Tinnitus improvement after CI reproduced across many independent centers and meta-analyses.","independence":"primarily-independent"},{"id":"hearing-aids","name":"Hearing aids (with hearing loss)","category":"hearing-tech","tier":2,"evidenceScore":3,"oneLiner":"If you have hearing loss with tinnitus, treating the hearing loss is one of the most effective single moves.","whatItIs":"Properly fitted amplification for coexisting hearing loss — the AAO-HNSF guideline recommends a hearing aid evaluation whenever hearing loss accompanies bothersome tinnitus.","howItWorks":"Amplification restores input to deprived auditory pathways (reducing the central gain that drives tinnitus), masks the tinnitus with ambient sound, and removes the strain of struggling to hear.","mechanism":"Restored auditory input + ambient masking","loudness":{"level":"limited","summary":"Observational reports of reduced audibility/awareness; controlled percept-level evidence is weak."},"distress":{"level":"moderate","summary":"In UNITI 2025 hearing aids were among the largest single-treatment effects on THI; Cochrane 2018 rates the controlled evidence as low quality."},"regulatory":{"status":"FDA regulated (hearing aids); OTC category exists","detail":"Regulated as hearing devices, not tinnitus treatments. AAO-HNSF 2014 guideline strength: 'Recommendation' (the middle tier — same as CBT; sound therapy gets only 'Option'). Since Sept 2024, Apple's AirPods Pro Hearing Aid Feature holds its own FDA De Novo authorization as OTC hearing-aid software — a $249 route to amplification for mild-moderate loss (no tinnitus-specific RCT of it exists).","sourceUrl":"https://www.entnet.org/quality-practice/quality-products/clinical-practice-guidelines/tinnitus/"},"availability":{"usa":"Widely available; OTC since 2022 for mild-moderate loss","europe":"Widely available; publicly funded in several countries","other":"Widely available","prescription":false,"cost":"$200 (OTC) – $7,000+/pair (premium fitted)","availableNow":true},"developer":"Multiple manufacturers","researchers":["Berthold Langguth"],"subtypes":["tinnitus with measurable hearing loss"],"safety":"Very safe; main risk is poor fitting.","bestSuitedFor":"Anyone with tinnitus plus hearing loss — get a hearing test first","bestResult":"Among the largest single-treatment THI effects in UNITI (N=461)","limitations":["Benefit entangled with the hearing benefit itself","Cochrane: low-quality controlled evidence","Doesn't help tinnitus with normal hearing"],"conflicts":"","studies":["uniti-2025","sereda-2018-cochrane","hoare-2014-cochrane-ha","guideline-aaohns-2014","guideline-nice-ng155","guideline-eu-2019"],"timeline":[{"year":2014,"event":"AAO-HNSF guideline recommends hearing aid evaluation for tinnitus with hearing loss."},{"year":2018,"event":"Cochrane finds low-quality controlled evidence — the practice rests on guideline consensus."},{"year":2025,"event":"UNITI-RCT strengthens the case: hearing aids among the top single treatments."}],"latest":[{"date":"2025-11-01","text":"UNITI-RCT: hearing aids among the largest single-treatment effect sizes.","url":"https://www.nature.com/articles/s41467-025-66165-1"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 2, evidence score 3/5","reason":"Guideline support plus UNITI head-to-head data, against a weak Cochrane base."},{"date":"2026-09-04","change":"replication: 'moderate' → 'limited-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Study records added: hoare-2014-cochrane-ha, guideline-aaohns-2014, guideline-nice-ng155, guideline-eu-2019.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."}],"scoreRationale":"Guideline recommendation and the UNITI head-to-head result earn 3/5; a trial isolating the tinnitus effect from the hearing benefit would settle it. Amplification-SPECIFIC randomized evidence is thin: Cochrane CD010151 found one RCT (N=91) and concluded there is no evidence to support or refute hearing aids as a routine tinnitus intervention; the rating rests on guideline consensus (all three major guidelines recommend aids with hearing loss), UNITI results and observational data.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["hearing-loss"],"replication":"limited-independent","safetyLevel":"strong","replicationNote":"Benefit signals from independent groups (UNITI, observational), but few amplification-specific RCTs.","independence":"primarily-independent"},{"id":"cbt-i","name":"CBT for Insomnia (CBT-I)","category":"sleep","tier":2,"evidenceScore":3,"oneLiner":"Tinnitus keeps you awake; insomnia makes tinnitus worse. Treating the insomnia breaks the loop.","whatItIs":"A structured insomnia therapy (sleep restriction, stimulus control, cognitive work) adapted for tinnitus-related insomnia. Sleep disturbance affects most people with bothersome tinnitus — estimates commonly exceed 40%.","howItWorks":"Poor sleep amplifies arousal and attention to tinnitus at night; CBT-I rebuilds sleep drive and decouples bed from wakeful listening, which lowers both insomnia and tinnitus distress.","mechanism":"Behavioral insomnia treatment reducing nighttime arousal","loudness":{"level":"none","summary":"No loudness effect claimed."},"distress":{"level":"moderate","summary":"RCT (N=102): clinically meaningful insomnia improvement in >80% with CBT-I vs 47% (audiology care) and 20% (support group); tinnitus distress (a secondary outcome) also improved, sustained at 6 months."},"regulatory":{"status":"Standard psychological therapy","detail":"CBT-I is first-line treatment for chronic insomnia generally.","sourceUrl":"https://www.tandfonline.com/doi/full/10.1080/16506073.2022.2084155"},"availability":{"usa":"Sleep clinics and digital CBT-I programs","europe":"Available","other":"Digital programs global","prescription":false,"cost":"$100–250/session or app-based from ~$50","availableNow":true},"developer":"—","researchers":["Elizabeth Marks"],"subtypes":["tinnitus with insomnia"],"safety":"Safe; temporary daytime sleepiness during sleep restriction.","bestSuitedFor":"Anyone whose tinnitus is worst at night or who dreads bedtime","bestResult":">80% vs 20% clinically meaningful insomnia improvement (vs support group)","limitations":["Single-center trial","Tinnitus outcomes were secondary","Requires real behavioral commitment for several weeks"],"conflicts":"","studies":["marks-2023-cbti"],"timeline":[{"year":2023,"event":"First adequately powered RCT of CBT-I for tinnitus-related insomnia (N=102, UCL/Barts)."}],"latest":[{"date":"2023-06-01","text":"RCT: CBT-I superior to both control arms with effects sustained at 6 months; 94% completion.","url":"https://www.tandfonline.com/doi/full/10.1080/16506073.2022.2084155"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 2, evidence score 3/5","reason":"One strong RCT in a high-prevalence problem; needs replication."},{"date":"2026-09-04","change":"replication: 'limited' → 'none' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"One well-run RCT with sustained effects earns 3/5; multicenter replication would raise it.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["general"],"replication":"none","safetyLevel":"strong","replicationNote":"Single positive RCT (Marks 2023); no replication attempt yet.","independence":"primarily-independent"},{"id":"act","name":"Acceptance & Commitment Therapy (ACT)","category":"behavioral","tier":2,"evidenceScore":3,"oneLiner":"Stop fighting the sound — a well-supported CBT cousin built on acceptance rather than control.","whatItIs":"A psychological therapy teaching acceptance of the tinnitus sensation and committed action toward valued living, rather than struggling to suppress the sound.","howItWorks":"Struggling against tinnitus feeds the attention-arousal loop. ACT builds psychological flexibility — the sound stays, the fight ends, and distress falls; trial mediation analyses show acceptance drives the improvement.","mechanism":"Psychological flexibility / acceptance-based habituation","loudness":{"level":"none","summary":"No loudness effect shown."},"distress":{"level":"moderate","summary":"Meta-analysis of 3 RCTs (N=100): THI −17.7 points vs untreated controls; Westin 2011 effect size d=1.04 vs waitlist."},"regulatory":{"status":"Standard psychological therapy","detail":"","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/37974721/"},"availability":{"usa":"ACT-trained therapists; some digital versions","europe":"Available, strong in Sweden/UK","other":"Growing","prescription":false,"cost":"$100–250/session","availableNow":true},"developer":"—","researchers":["Vendela Westin","Hugo Hesser"],"subtypes":["chronic subjective tinnitus"],"safety":"No reported harms.","bestSuitedFor":"People who feel stuck in a daily battle with the sound","bestResult":"Pooled THI −17.7 (95% CI −23.5 to −11.8) vs untreated control","limitations":["Small pooled sample (~100)","Fewer trials than limited-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"Beating an active control with 6-month persistence earns 3/5; multicenter replication would raise it.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["general"],"replication":"limited-independent","safetyLevel":"strong","replicationNote":"McKenna 2017 plus smaller independent mindfulness trials; limited.","independence":"primarily-independent"},{"id":"spi-1005","name":"SPI-1005 (ebselen)","category":"drugs","tier":3,"evidenceScore":2,"oneLiner":"The most advanced drug with a tinnitus-relevant claim — but its trials are in Meniere's disease, and the tinnitus data are unblinded.","whatItIs":"An oral anti-inflammatory/antioxidant (glutathione peroxidase mimetic) from Sound Pharmaceuticals, in Phase 3 for Meniere's disease with tinnitus tracked as a patient-reported outcome.","howItWorks":"Mimics glutathione peroxidase to reduce oxidative stress and inflammation in the inner ear — a mechanism relevant to hearing loss, Meniere's symptoms and possibly the cochlear component of tinnitus.","mechanism":"Glutathione peroxidase mimetic (anti-oxidative, anti-inflammatory)","loudness":{"level":"limited","summary":"Company reports ≥30% patient-reported tinnitus severity improvement — from an open-label extension, so high bias risk and not a loudness measurement."},"distress":{"level":"limited","summary":"Same open-label PRO data; no blinded tinnitus outcome has been published."},"regulatory":{"status":"Investigational (FDA Breakthrough Therapy designation — for hearing loss in Meniere's, NOT tinnitus)","detail":"Breakthrough Therapy designation granted December 1, 2025 for treatment of hearing loss in Meniere's disease. STOPMD-3 results are company-reported; no peer-reviewed publication located as of Sept 2026. FDA publishes no BTD registry, so the sponsor announcement is the strongest available source.","sourceUrl":"https://soundpharma.com/sound-pharma-receives-fda-breakthrough-therapy-designation-for-spi-1005-to-treat-menieres-disease-2/"},"availability":{"usa":"Not available — clinical trials only","europe":"Not available","other":"Not available","prescription":true,"cost":"N/A","availableNow":false},"developer":"Sound Pharmaceuticals (Seattle)","researchers":[],"subtypes":["Meniere's disease (tinnitus as secondary symptom)"],"safety":"Reported as well tolerated in trials to date (company-reported).","bestSuitedFor":"Watch-list item — Meniere's patients first, primary tinnitus later at best","bestResult":"Phase 3 co-primary endpoints met (company-reported); ≥30% tinnitus PRO improvement in open-label extension","limitations":["No peer-reviewed Phase 3 publication yet","Tinnitus data are open-label PROs","Indication is Meniere's, not tinnitus"],"conflicts":"All results to date are company press releases.","studies":["stopmd3-2024"],"timeline":[{"year":2024,"event":"STOPMD-3 Phase 3 topline: co-primary endpoints met (company-reported, December)."},{"year":2025,"event":"FDA Breakthrough Therapy designation (December)."},{"year":2026,"event":"Open-label Phase 3 safety study completes enrollment (July); primary completion December 2026."}],"latest":[{"date":"2026-07-14","text":"Enrollment completed in the ~200-patient open-label Phase 3 safety study (NCT06859788).","url":"https://www.businesswire.com/news/home/20260714809135/en/Sound-Pharma-completes-enrollment-of-Open-Label-Phase-3-study-of-SPI-1005-in-Menieres-Disease"}],"history":[{"date":"2026-09-03","change":"Phase 2 audit: removed from the Top 10 (was #10); replaced by rTMS","reason":"Adversarial review: a slot on an evidence-ranked list for an agent with ZERO controlled tinnitus data (open-label, secondary outcomes, different disease) was pipeline hype — while rTMS has 29 sham-controlled RCTs showing at least short-term benefit. SPI-1005 remains a prominent watch item in the trials database."},{"date":"2026-09-03","change":"Initial rating: Tier 3, evidence score 2/5","reason":"Late-stage program but tinnitus evidence is unblinded and unpublished."},{"date":"2026-09-04","change":"independence: 'primarily-sponsor' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"A Phase 3 program with BTD earns 2/5 for tinnitus specifically: the tinnitus outcomes are open-label, company-reported, and in a Meniere's population. The ongoing Phase 3 (NCT06859788) is open-label single-group — it cannot produce controlled tinnitus evidence.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["meniere"],"narrowPopulation":true,"narrowNote":"Studied ONLY in Meniere's disease. There is no trial of this drug in ordinary tinnitus.","replication":"none","safetyLevel":"limited","independence":"primarily-sponsor"},{"id":"trtl-913","name":"TRTL-913 (GABA-A modulator)","category":"drugs","tier":3,"evidenceScore":1,"oneLiner":"A new $106M bet that a GABA-A drug can quiet tinnitus — Phase 2 starts soon; no human tinnitus data yet.","whatItIs":"An oral GABA-A positive allosteric modulator (licensed from Hansoh) being developed for tinnitus by Tortugas Neuroscience, which launched in April 2026 with $106M.","howItWorks":"Tinnitus involves reduced inhibitory (GABAergic) tone in central auditory circuits; enhancing GABA-A signaling aims to restore inhibition and damp the hyperactivity generating the phantom sound.","mechanism":"GABA-A positive allosteric modulation (restoring central inhibition)","loudness":{"level":"none","summary":"No human tinnitus data yet."},"distress":{"level":"none","summary":"No human tinnitus data yet."},"regulatory":{"status":"Investigational (Phase 2 registered)","detail":"NCT07777549: Phase 2, N=100, not yet recruiting; estimated completion August 2027. One of only two Phase 2+ drug trials with tinnitus as the primary indication.","sourceUrl":"https://clinicaltrials.gov/study/NCT07777549"},"availability":{"usa":"Not available — trial only","europe":"Not available","other":"Not available","prescription":true,"cost":"N/A","availableNow":false},"developer":"Tortugas Neuroscience","researchers":[],"subtypes":["to be defined by the trial"],"safety":"Unknown in tinnitus populations; GABA-A drugs generally carry sedation/dependence considerations.","bestSuitedFor":"Watch-list item only","bestResult":"None yet — first tinnitus trial pending","limitations":["Zero human tinnitus data","History is against tinnitus drugs: every rigorously placebo-controlled candidate so far has failed"],"conflicts":"","studies":["bmj-nma-2025"],"timeline":[{"year":2026,"event":"Tortugas Neuroscience launches with $106M (April); Phase 2 tinnitus trial registered."}],"latest":[{"date":"2026-04-15","text":"Tortugas launches with four Phase 2-stage neuro assets including TRTL-913 for tinnitus.","url":"https://www.fiercebiotech.com/biotech/tortugas-comes-out-its-shell-106m-fund-4-phase-2-stage-neuro-drugs"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 3, evidence score 1/5","reason":"Credible mechanism and funding; no human evidence."},{"date":"2026-09-04","change":"independence: 'unclear' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."}],"scoreRationale":"Score 1/5: nothing but mechanism and money so far — which is exactly what the ranking rules say cannot earn a high score.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["general"],"replication":"none","safetyLevel":null,"independence":"unclear"},{"id":"somatic-physio","name":"Physiotherapy & TMJ treatment (somatic tinnitus)","category":"somatic","tier":3,"evidenceScore":2,"oneLiner":"When tinnitus changes with your jaw or neck, treating the jaw or neck can change the tinnitus.","whatItIs":"Physical therapy for the neck, TMJ (jaw) treatment, and musculoskeletal care for somatosensory tinnitus — the subtype where head/neck signals modulate the sound. Roughly 60–80% of tinnitus patients can modulate their tinnitus somewhat with jaw or neck maneuvers (Ralli 2016: 79.7% in TMJ/neck patients; Lee 2020: 61.7% in a general clinic; Sanchez & Rocha 2011 review: ~65%). Note: chiropractic/osteopathic manipulation adds no evidence over exercise-based physiotherapy, and high-velocity neck manipulation carries a rare but serious artery-dissection risk.","howItWorks":"Somatosensory nerves from the jaw and upper neck converge on the dorsal cochlear nucleus, the same circuit implicated in tinnitus generation. Abnormal muscle or joint input can drive the percept; treating it can reduce the drive.","mechanism":"Reducing aberrant somatosensory input to the dorsal cochlear nucleus","loudness":{"level":"limited","summary":"Somatic maneuvers demonstrably change the percept's loudness/pitch; after TMJ-disorder treatment, 43% had decreased tinnitus at 2 years vs 12% of waiting-list controls (Tullberg & Ernberg 2006, PMID 16546850, p<0.001)."},"distress":{"level":"limited","summary":"Supervised physiotherapy programs improved severity in controlled studies; no large multicenter RCT yet."},"regulatory":{"status":"Standard physical/dental therapy","detail":"","sourceUrl":"https://journals.lww.com/md-journal/fulltext/2022/08050/effect_of_adding_a_supervised_physical_therapy.64.aspx"},"availability":{"usa":"Physical therapists, TMJ specialists","europe":"Available; strong programs in Belgium/Netherlands","other":"Available","prescription":false,"cost":"$75–200/session; TMJ treatment varies widely","availableNow":true},"developer":"—","researchers":[],"subtypes":["somatic/somatosensory tinnitus","tinnitus with TMJ disorder or neck dysfunction"],"safety":"Safe with qualified providers; avoid aggressive or expensive unproven dental interventions.","bestSuitedFor":"People whose tinnitus changes with jaw clenching, neck movement or posture","bestResult":"43% vs 12% decreased tinnitus 2 years after TMJ-disorder treatment","limitations":["Subtype definitions vary — prevalence numbers are inconsistent","No large multicenter RCT (VA trial NCT05434637 running, due 2027)"],"conflicts":"","studies":["physio-2022-somatic","michiels-2016-cervical"],"extraSources":[{"title":"Tullberg & Ernberg 2006, Acta Odontol Scand — TMJ treatment 2-year follow-up (43% vs 12%)","url":"https://pubmed.ncbi.nlm.nih.gov/16546850/"},{"title":"Ralli 2016 — somatic modulation 79.7% (PMID 28099967)","url":"https://pubmed.ncbi.nlm.nih.gov/28099967/"}],"timeline":[{"year":2006,"event":"TMJ-treatment 2-year follow-up: 43% vs 12% improved (Tullberg & Ernberg)."},{"year":2022,"event":"Controlled study: supervised physiotherapy improves somatic tinnitus severity."},{"year":2024,"event":"VA somatosensory tinnitus RCT (N=72) recruiting."}],"latest":[{"date":"2026-06-01","text":"VA somatosensory RCT continues recruiting; UCLH 'somatic tracking' attention trial also active.","url":"https://clinicaltrials.gov/study/NCT05434637"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 3, evidence score 2/5","reason":"Mechanistically grounded with controlled but small evidence."},{"date":"2026-09-04","change":"replication: 'limited' → 'limited-independent' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Study records added: michiels-2016-cervical.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."}],"scoreRationale":"Real percept modulation and positive controlled studies earn 2/5; a proper multicenter RCT would move it.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"moderate","subtypeTags":["somatic"],"replication":"limited-independent","safetyLevel":"moderate","replicationNote":"Independent groups (Michiels, Eladl) report benefit in somatic subgroups; small trials.","independence":"primarily-independent"},{"id":"sound-therapy","name":"Sound therapy & masking","category":"sound-therapy","tier":4,"evidenceScore":2,"oneLiner":"Widely used, low-risk, valued by many — but never proven better than placebo in controlled trials.","whatItIs":"Background sound — noise, nature sounds, music, sound generators or apps — used to partially cover tinnitus, ease its intrusiveness, and help sleep and focus.","howItWorks":"External sound reduces the contrast between tinnitus and silence, gives the auditory system real input to process, and supports habituation. It manages the experience rather than changing the tinnitus.","mechanism":"Partial masking / contrast reduction / habituation support","loudness":{"level":"none","summary":"No controlled evidence that sound therapy durably reduces the percept. Newer music-therapy meta-analyses report loudness improvements, but from low-quality trials."},"distress":{"level":"limited","summary":"Cochrane 2018: NO usable trial data exist for sound therapy vs waitlist/placebo/information — the central question has simply never been answered; the 8 trials (N=590) only compared device types, with no differences found. Guideline status: 'Option'. Many individuals still find it genuinely helpful day to day."},"regulatory":{"status":"Guideline 'option'; consumer products unregulated","detail":"AAO-HNSF 2014 lists sound therapy as an option (benefit/harm balance, medium-quality evidence).","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/30589445/"},"availability":{"usa":"Free apps to clinical sound generators","europe":"Same","other":"Same","prescription":false,"cost":"Free–$500 (bedside/wearable generators)","availableNow":true},"developer":"Multiple","researchers":["Magdalena Sereda"],"subtypes":["chronic subjective tinnitus"],"safety":"Very safe at comfortable volumes; keep sound below or at the tinnitus level rather than drowning it out.","bestSuitedFor":"Sleep-time relief, quiet-environment comfort, first self-help step","bestResult":"Individual preference effects are real; group-level superiority unproven","limitations":["The sound-therapy-vs-placebo question has never produced usable trial data (absence of evidence, not proof of no effect)","Effects end when the sound stops","Commercial products often oversell the science"],"conflicts":"","studies":["sereda-2018-cochrane","trtt-2019","most-2025","guideline-aaohns-2014","guideline-nice-ng155","guideline-eu-2019"],"timeline":[{"year":1903,"event":"First 'masking' descriptions in the literature."},{"year":2018,"event":"Cochrane: no superiority over placebo demonstrated."},{"year":2019,"event":"TRTT: sound generators added nothing measurable over counseling."}],"latest":[{"date":"2024-06-01","text":"Music-therapy meta-analysis (14 studies, N=1,239) reports THI and loudness improvements — evidence quality remains low.","url":"https://www.sciencedirect.com/science/article/abs/pii/S0196070924001480"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 4, evidence score 2/5","reason":"Safe and widely valued; unproven vs placebo."},{"date":"2026-09-04","change":"replication: 'limited' → 'conflicting' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is 'conflicting', never forced onto the positive scale); evidence independence made an explicit, visible dimension. Evidence scores unchanged by this relabeling."},{"date":"2026-09-04","change":"Marked 'Evidence rating under re-evaluation' (DFCRS N=440 RCT under formal review).","reason":"New evidence of a magnitude that could change the rating; per platform policy the public rating is never auto-changed — it is flagged while under review."},{"date":"2026-09-04","change":"Study records added: most-2025, guideline-aaohns-2014, guideline-nice-ng155, guideline-eu-2019.","reason":"Audit-identified coverage gaps filled with verified extractions (see audit-improvement/acquisition-report.md). No score change from additions alone."},{"date":"2026-09-04","change":"Formal re-evaluation completed for the MOST/DFCRS N=440 double-blind RCT: evidence score UNCHANGED at 2/5; 'under re-evaluation' flag cleared.","reason":"The trial is the largest and best-blinded sound-therapy RCT but compares four ACTIVE sounds with no placebo arm; the customized-arm advantage (~4 THI points vs unmodified music) is statistically significant yet small and unadjusted for multiplicity, and the authors state placebo effects cannot be excluded. Size alone does not raise a rating."}],"scoreRationale":"Score 2/5 CONFIRMED after formal re-evaluation of the MOST trial (N=440, the largest double-blind sound-therapy RCT, eClinicalMedicine 2025): all four active sound arms improved similarly; the customized (DFCRS) arm beat unmodified music by only ~4 THI points (statistically significant, clinically small, no multiplicity adjustment) and the trial has no no-sound arm, so placebo effects cannot be excluded — the authors say so themselves. This is consistent with Cochrane 2018 (no strong evidence) and the guideline split (AAO-HNSF: option; NICE/EU: research-only; German S3: against sound generators). A large trial does not raise a rating by size alone; what it shows is modest, possibly non-specific benefit.","lastReviewed":"2026-09-03","evidenceThrough":"2026-09-03","confidence":"high","subtypeTags":["general"],"fmqs":{"label":"Explore masking and personalized sound","feature":"sound therapy"},"replication":"conflicting","safetyLevel":"strong","replicationNote":"Results discordant across independent trials; Cochrane 2018 found no strong evidence. The MOST trial (N=440, double-blind, 2025) found all active sound arms improved similarly, with a small advantage for customized modulation and no placebo arm — formally reviewed 2026-09-04, rating unchanged.","independence":"primarily-independent"},{"id":"trt","name":"Tinnitus Retraining Therapy (TRT)","category":"behavioral","tier":4,"evidenceScore":2,"oneLiner":"The counseling helps — but the trial designed to prove TRT found its sound generators added nothing.","whatItIs":"A structured program combining directive counseling with low-level sound generators, aiming for habituation over 12–24 months.","howItWorks":"Counseling reframes tinnitus as neutral; constant low-level sound is supposed to aid subconscious habituation. The TRTT trial suggests the counseling carries the benefit.","mechanism":"Habituation via counseling (+ sound enrichment of unproven added value)","loudness":{"level":"none","summary":"No loudness effect shown."},"distress":{"level":"moderate","summary":"All TRTT arms improved substantially (~77.5% achieved meaningful TQ reduction) — but TRT showed no advantage over standard care."},"regulatory":{"status":"Clinical protocol (no device authorization needed)","detail":"","sourceUrl":"https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2734346"},"availability":{"usa":"TRT-trained audiologists","europe":"Available","other":"Available","prescription":false,"cost":"$2,000–5,000 for a full program incl. devices","availableNow":true},"developer":"Jastreboff protocol","researchers":["Craig Formby","Roberta Scherer"],"subtypes":["chronic subjective tinnitus"],"safety":"Safe.","bestSuitedFor":"People who want a structured audiologist-led program — knowing CBT has better evidence","bestResult":"Large within-group improvement in TRTT; no between-group advantage","limitations":["TRTT: no meaningful advantage over standard care","Long, expensive protocol","CBT beat TRT directly in one trial"],"conflicts":"","studies":["trtt-2019","fuller-2020-cochrane"],"timeline":[{"year":1990,"event":"Jastreboff's neurophysiological model launches TRT."},{"year":2019,"event":"TRTT (N=151): TRT no better than standard of care at 18 months."}],"latest":[{"date":"2020-09-01","text":"Follow-up analyses attribute TRTT benefit mainly to counseling, not sound generators.","url":"https://pubs.asha.org/doi/10.1044/2020_AJA-20-00024"}],"history":[{"date":"2026-09-03","change":"Initial rating: Tier 4, evidence score 2/5","reason":"Counseling component works; the distinctive TRT elements failed their definitive test."},{"date":"2026-09-04","change":"replication: 'limited' → 'conflicting' (new 5-category independent-replication semantics); independence: 'primarily-independent' (new evidence-independence field)","reason":"Research-quality audit: replication now means independent reproduction of positive findings (same-lab/sponsor repeats are 'same-group'; attempted-and-discordant is ed with tone playback from an app (10 minutes/day), sold directly to consumers as a wellness device.","howItWorks":"Claims the bimodal principle: pairing tones with synchronized skin vibration to drive auditory-circuit plasticity — via the wrist rather than tongue or neck.","mechanism":"Auditory + vibrotactile pairing (wrist)","loudness":{"level":"none","summary":"No loudness data."},"distress":{"level":"limited","summary":"One company-run study: TFI −17.9 in the experimental group — unblinded, no sham vibration, all authors are company employees."},"regulatory":{"status":"Consumer wellness device (no FDA authorization found)","detail":"Sold as general wellness; no FDA clearance/authorization for tinnitus treatment located.","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/38050877/"},"availability":{"usa":"Direct-to-consumer online","europe":"Ships internationally","other":"Online","prescription":false,"cost":"≈$500 device + subscription (varies)","availableNow":true},"developer":"Neosensory (David Eagleman)","researchers":["David Eagleman"],"subtypes":["chronic subjective tinnitus"],"safety":"Benign (vibration + sound).","bestSuitedFor":"Consumers who accept wellness-tier evidence","bestResult":"TFI −17.9 (company study, unblinded)","limitations":["Single small manufacturer-run study in a minor journal","No sham control — participants knew their group","Wrist stimulation lacks the anatomical rationale of tongue/neck approaches"],"conflicts":"All study authors are Neosensory employees or its founder/CEO.","studies":["perrotta-2023-duo"],"timeline":[{"year":2022,"event":"Company announces wristband tinnitus results."},{"year":2023,"event":"Study published in International Tinnitus Journal."}],"latest":[{"date":"2024-06-01","text":"Company active; distribution partnership announced. No new controlled evidence.","url":"https://hearingreview.com/hearing-loss/tinnitus/tinnitus-therapy/david-eagleman-on-neosensory-bimodal-technology-and-a-new-partnership-with-audconnex"}],"h
