# Checks a release candidate on Linux. Test branches only. Read-only, no secrets, commits nothing, publishes nothing, and starts no research run.
name: Linux candidate check
on:
  push:
    branches: ["linux-test/**"]
permissions:
  contents: read
concurrency:
  group: linux-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0              # the suite compares against production's history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: The SDK version production uses, for one test of what the engine calls. There is no key here
        run: pip install "anthropic==1.15.0"
      - name: Check this candidate
        run: python -X utf8 .github/linux-candidate/linux_check.py
