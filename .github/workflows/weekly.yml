# Tinnitus Evidence — production weekly research cycle (serverless).
#
# scan -> AI evaluation (ANTHROPIC_API_KEY from Secrets) -> verification -> routine publish
# -> consequential changes HELD -> bot commit -> GitHub Pages redeploy.
#
# PRIVACY (public repo): the held-changes queue contains unpublished internal review material
# (raw AI proposed-change reports). It is stored ONLY encrypted (held.json.enc, AES-256, key =
# STATE_KEY repo secret); the plaintext never gets committed, and the job refuses to run/commit
# if held items exist without the key. The awaiting-evaluation queue is public-safe by
# construction: it holds only bibliographic metadata, never evaluation output (evaluated items
# are routed out of it in the same run).
name: Weekly research cycle
on:
  schedule:
    - cron: "0 6 1,15 * *"        # the 1st and 15th of every month, 06:00 Pacific — timezone-aware, stable across PST/PDT (owner decision, 21 Oct 2026)
      timezone: "America/Los_Angeles"
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/weekly.yml"]   # self-test on workflow changes only
concurrency:
  group: weekly-cycle
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator SDK
        run: pip install "anthropic==1.15.0"   # the SDK version every paid test used; a newer major is untested
      - name: Restore private held-state
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -f data/review-queue/held.json.enc ]; then
            if [ -z "$STATE_KEY" ]; then
              echo "::error::held.json.enc exists but the STATE_KEY secret is missing — cannot process holds safely."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/review-queue/held.json.enc \
              -out data/review-queue/held.json -pass env:STATE_KEY
          fi
      - name: Restore private staged-review store
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -f data/review-queue/staged.json.enc ]; then
            if [ -z "$STATE_KEY" ]; then
              echo "::error::staged.json.enc exists but the STATE_KEY secret is missing - cannot process staged items safely."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in data/review-queue/staged.json.enc \
              -out data/review-queue/staged.json -pass env:STATE_KEY
          fi
      - name: Run weekly cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python engine/weekly_cycle.py
      - name: Protect private held-state (never commit plaintext)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          ITEMS=$(python -c "import json;print(len(json.load(open('data/review-queue/held.json'))['items']))" 2>/dev/null || echo 0)
          if [ "$ITEMS" != "0" ]; then
            if [ -z "$STATE_KEY" ]; then
              echo "::error::$ITEMS held item(s) exist but STATE_KEY secret is not set — refusing to commit internal review material to a public repo. Add the STATE_KEY secret and re-run; nothing was published or lost (source items remain in the committed queue)."
              exit 1
            fi
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/review-queue/held.json \
              -out data/review-queue/held.json.enc -pass env:STATE_KEY
          fi
          rm -f data/review-queue/held.json
      - name: Protect private staged-review store (never commit plaintext)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          ITEMS=$(python -c "import json;print(len(json.load(open('data/review-queue/staged.json'))['items']))" 2>/dev/null || echo 0)
          if [ "$ITEMS" != "0" ]; then
            if [ -z "$STATE_KEY" ]; then
              echo "::error::$ITEMS staged item(s) exist but STATE_KEY secret is not set - refusing to commit unpublished AI evaluations to a public repo. Nothing was published or lost."
              exit 1
            fi
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in data/review-queue/staged.json \
              -out data/review-queue/staged.json.enc -pass env:STATE_KEY
          else
            rm -f data/review-queue/staged.json.enc
          fi
          rm -f data/review-queue/staged.json
      - name: Regenerate SEO static pages + regression checks
        run: |
          python tools/build_seo.py
          python tools/check_seo.py
      - name: Commit results and redeploy site
        run: |
          git config user.name "tinnitus-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data engine treatments trials research guides ask research-questions sitemap.xml index.html about.html   # index/about carry build-time stats (e.g. latest research scan); ask/ and research-questions/ are regenerated by build_seo as well
          if git diff --cached --quiet; then
            echo "No changes to commit (quiet cycle)."
          else
            git commit -m "Automated weekly research update"
            git push origin main
          fi
          git push -f origin main:gh-pages   # GitHub Pages serves gh-pages
      - name: Fail loudly if the AI evaluation did not work
        if: always()   # runs after results are committed, so a red run never costs scanned items
        run: python engine/check_evaluation_health.py
