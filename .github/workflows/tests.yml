# The engine's tests, on Linux, on every push by a person. No secrets, read-only, and it starts no research run. The research run's own commits don't trigger it.
name: Engine tests
on:
  push:
    branches-ignore: [gh-pages]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0              # one test reads the history of the published records
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Engine test suite
        run: python -X utf8 -W ignore -m unittest discover -s engine/tests
